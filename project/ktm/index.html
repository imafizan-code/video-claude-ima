<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0d0d10;
        --ink: #ffffff;
        --accent: #e5173f;
        --font-display: "Montserrat", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: var(--font-display);
      }
      .shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        z-index: 40;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13.7"
      data-width="1080"
      data-height="1920"
    >
      <!-- Footage: the trimmed cut, natural station sound kept low under the music -->
      <video id="v1" class="clip shot" src="assets/clips/s1_hook.mp4" data-start="0" data-duration="1.5" data-track-index="0" data-has-audio="true" data-volume="0.45" data-fade-out="0.04" playsinline></video>
      <video id="v2" class="clip shot" src="assets/clips/s2_sign.mp4" data-start="1.5" data-duration="0.9" data-track-index="0" data-has-audio="true" data-volume="0.55" data-fade-in="0.04" data-fade-out="0.04" playsinline></video>
      <video id="v3" class="clip shot" src="assets/clips/s3_counter.mp4" data-start="2.4" data-duration="0.9" data-track-index="0" data-has-audio="true" data-volume="0.45" data-fade-in="0.04" data-fade-out="0.04" playsinline></video>
      <video id="v4" class="clip shot" src="assets/clips/s4_card.mp4" data-start="3.3" data-duration="1.9" data-track-index="0" data-has-audio="true" data-volume="0.45" data-fade-in="0.04" data-fade-out="0.04" playsinline></video>
      <video id="v5" class="clip shot" src="assets/clips/s5_pull.mp4" data-start="5.2" data-duration="1.2" data-track-index="0" data-has-audio="true" data-volume="0.5" data-fade-in="0.04" data-fade-out="0.04" playsinline></video>
      <video id="v6" class="clip shot" src="assets/clips/s6_trolley.mp4" data-start="6.4" data-duration="2" data-track-index="0" data-has-audio="true" data-volume="0.5" data-fade-in="0.04" data-fade-out="0.04" playsinline></video>
      <video id="v7" class="clip shot" src="assets/clips/s7_blue.mp4" data-start="8.4" data-duration="1.2" data-track-index="0" data-has-audio="true" data-volume="0.45" data-fade-in="0.04" data-fade-out="0.04" playsinline></video>
      <video id="v8" class="clip shot" src="assets/clips/s8_sit.mp4" data-start="9.6" data-duration="0.8" data-track-index="0" data-has-audio="true" data-volume="0.45" data-fade-in="0.04" data-fade-out="0.04" playsinline></video>
      <video id="v9" class="clip shot" src="assets/clips/s9_platform.mp4" data-start="10.4" data-duration="3.3" data-track-index="0" data-has-audio="true" data-volume="0.6" data-fade-in="0.04" data-fade-out="0.8" playsinline></video>

      <div id="flash" aria-hidden="true"></div>

      <!-- Graphics: one scene per beat, all transparent over the footage -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="1.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="route" data-composition-id="route" data-composition-src="compositions/route.html" data-start="1.5" data-duration="8.9" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="pin" data-composition-id="pin" data-composition-src="compositions/pin.html" data-start="1.5" data-duration="0.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="step1" data-composition-id="step1" data-composition-src="compositions/step1.html" data-start="1.5" data-duration="1.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="card" data-composition-id="card" data-composition-src="compositions/card.html" data-start="3.3" data-duration="1.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="step2" data-composition-id="step2" data-composition-src="compositions/step2.html" data-start="5.2" data-duration="1.2" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="copilot" data-composition-id="copilot" data-composition-src="compositions/copilot.html" data-start="6.4" data-duration="2" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="step3" data-composition-id="step3" data-composition-src="compositions/step3.html" data-start="8.4" data-duration="1.2" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="board" data-composition-id="board" data-composition-src="compositions/board.html" data-start="10.4" data-duration="3.3" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Music bed: no voice in the footage, so it carries the film under the station ambience -->
      <audio id="bgm" src="assets/bgm/bed.wav" data-start="0" data-duration="13.7" data-track-index="5" data-volume="0.85" data-fade-in="0.05" data-fade-out="1.2" data-audio-group="music"></audio>

      <!-- SFX: each placed so its peak lands one frame after the picture event -->
      <audio id="sx-hook-thud" src="assets/sfx/thud.ogg" data-start="0" data-duration="0.57" data-track-index="6" data-volume="0.6" data-audio-group="sfx"></audio>
      <audio id="sx-hook-sub" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="1.5" data-track-index="7" data-volume="0.16" data-fade-out="0.4" data-audio-group="sfx"></audio>
      <audio id="sx-cut2" src="assets/sfx/swish1.ogg" data-start="1.31" data-duration="0.66" data-track-index="6" data-volume="0.8" data-audio-group="sfx"></audio>
      <audio id="sx-pin" src="assets/sfx/tok.ogg" data-start="1.83" data-duration="0.27" data-track-index="7" data-volume="0.6" data-audio-group="sfx"></audio>
      <audio id="sx-pin-pop" src="assets/sfx/pop.mp3" data-start="1.92" data-duration="0.5" data-track-index="8" data-volume="0.45" data-audio-group="sfx"></audio>
      <audio id="sx-cut3" src="assets/sfx/swish2.ogg" data-start="2.26" data-duration="0.48" data-track-index="6" data-volume="1.4" data-audio-group="sfx"></audio>
      <audio id="sx-step1" src="assets/sfx/click-soft.mp3" data-start="1.61" data-duration="0.37" data-track-index="9" data-volume="0.8" data-audio-group="sfx"></audio>
      <audio id="sx-card-in" src="assets/sfx/cardslide.ogg" data-start="3.25" data-duration="0.6" data-track-index="6" data-volume="0.9" data-audio-group="sfx"></audio>
      <audio id="sx-card-shine" src="assets/sfx/sparkle.mp3" data-start="3.5" data-duration="1.4" data-track-index="8" data-volume="0.14" data-fade-out="0.5" data-audio-group="sfx"></audio>
      <audio id="sx-card-flip" src="assets/sfx/cardshove.ogg" data-start="4.12" data-duration="0.77" data-track-index="7" data-volume="1" data-audio-group="sfx"></audio>
      <audio id="sx-cut5" src="assets/sfx/swish3.ogg" data-start="5.2" data-duration="0.38" data-track-index="6" data-volume="2.2" data-audio-group="sfx"></audio>
      <audio id="sx-step2" src="assets/sfx/click-soft.mp3" data-start="5.31" data-duration="0.37" data-track-index="7" data-volume="0.8" data-audio-group="sfx"></audio>
      <audio id="sx-cut6" src="assets/sfx/swish1.ogg" data-start="6.21" data-duration="0.66" data-track-index="6" data-volume="0.7" data-audio-group="sfx"></audio>
      <audio id="sx-copilot" src="assets/sfx/pop.mp3" data-start="6.63" data-duration="0.5" data-track-index="7" data-volume="0.45" data-audio-group="sfx"></audio>
      <audio id="sx-cut7" src="assets/sfx/swish2.ogg" data-start="8.26" data-duration="0.48" data-track-index="6" data-volume="1.4" data-audio-group="sfx"></audio>
      <audio id="sx-step3" src="assets/sfx/click-soft.mp3" data-start="8.51" data-duration="0.37" data-track-index="7" data-volume="0.8" data-audio-group="sfx"></audio>
      <audio id="sx-cut8" src="assets/sfx/swish3.ogg" data-start="9.6" data-duration="0.38" data-track-index="6" data-volume="2.2" data-audio-group="sfx"></audio>
      <audio id="sx-swell" src="assets/sfx/impact-bass-2.mp3" data-start="9.9" data-duration="2.59" data-track-index="8" data-volume="0.2" data-audio-group="sfx"></audio>
      <audio id="sx-board" src="assets/sfx/click-soft.mp3" data-start="10.41" data-duration="0.37" data-track-index="7" data-volume="0.8" data-audio-group="sfx"></audio>
      <audio id="sx-flap1" src="assets/sfx/flap1.ogg" data-start="11.05" data-duration="0.37" data-track-index="6" data-volume="0.75" data-audio-group="sfx"></audio>
      <audio id="sx-flap2" src="assets/sfx/flap2.ogg" data-start="11.22" data-duration="0.36" data-track-index="7" data-volume="0.75" data-audio-group="sfx"></audio>
      <audio id="sx-flap3" src="assets/sfx/flap1.ogg" data-start="11.45" data-duration="0.37" data-track-index="6" data-volume="0.75" data-audio-group="sfx"></audio>
      <audio id="sx-flap4" src="assets/sfx/flap2.ogg" data-start="11.62" data-duration="0.36" data-track-index="7" data-volume="0.75" data-audio-group="sfx"></audio>
      <audio id="sx-flap5" src="assets/sfx/flap1.ogg" data-start="11.85" data-duration="0.37" data-track-index="6" data-volume="0.85" data-audio-group="sfx"></audio>
      <audio id="sx-outro" src="assets/sfx/sparkle.mp3" data-start="11.55" data-duration="1.3" data-track-index="9" data-volume="0.12" data-fade-out="0.5" data-audio-group="sfx"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Slow handheld push on every shot so nothing sits dead
      const shots = [
        ["#v1", 0, 1.5], ["#v2", 1.5, 0.9], ["#v3", 2.4, 0.9], ["#v4", 3.3, 1.9], ["#v5", 5.2, 1.2],
        ["#v6", 6.4, 2], ["#v7", 8.4, 1.2], ["#v8", 9.6, 0.8], ["#v9", 10.4, 3.3],
      ];
      shots.forEach(([sel, at, dur]) => {
        tl.fromTo(sel, { scale: 1.02 }, { scale: 1.08, duration: dur, ease: "none" }, at);
      });

      // Punch-in snaps on the energetic cuts
      [["#v2", 1.5], ["#v4", 3.3], ["#v6", 6.4], ["#v9", 10.4]].forEach(([sel, at]) => {
        tl.fromTo(sel, { scale: 1.16 }, { scale: 1.03, duration: 0.32, ease: "expo.out", immediateRender: false }, at);
      });

      // One soft exposure pop off the hook
      tl.fromTo("#flash", { opacity: 0.0 }, { opacity: 0.55, duration: 0.05, ease: "none" }, 1.45);
      tl.to("#flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, 1.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
