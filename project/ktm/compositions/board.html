  <style>
    #root {

    #board-panel {
      position: absolute;

    }
    #board-head {
      display: flex;

    #board-led {

    #board-status {
      display: flex;

    #board-cells {

    .board-cell {

    .board-char {
      position: absolute;
      inset: 0;

      justify-content: center;
      font-family: "Space Mono", monospace;
      font-size: 132px;

      color: #f4f1e8;

    }
    .board-seam {
      position: absolute;
      left: 0;

    #board-bye {
      position: absolute;

    #board-bye span {
      color: #ffb547;
    }
  </style>
  <div id="root" data-composition-id="board" data-width="1080" data-height="1920">
    <div id="board-panel" class="clip" data-start="0" data-duration="3.3">
      <div id="board-head"><span>NEXT STOP</span><span id="board-status"><i id="board-led"></i>TIBA</span></div>
      <div id="board-cells" data-layout-allow-occlusion>
        <div class="board-cell"><div id="board-c0" class="board-char" data-layout-allow-occlusion>R</div><div class="board-seam"></div></div>
        <div class="board-cell"><div id="board-c1" class="board-char" data-layout-allow-occlusion>U</div><div class="board-seam"></div></div>
        <div class="board-cell"><div id="board-c2" class="board-char" data-layout-allow-occlusion>M</div><div class="board-seam"></div></div>
        <div class="board-cell"><div id="board-c3" class="board-char" data-layout-allow-occlusion>A</div><div class="board-seam"></div></div>
        <div class="board-cell"><div id="board-c4" class="board-char" data-layout-allow-occlusion>H</div><div class="board-seam"></div></div>
      </div>
    </div>
    <div id="board-bye" class="clip" data-start="0" data-duration="3.3">Jumpa next trip<span>!</span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const WORD = "RUMAH";
    const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const FLIP = 0.06; // seconds per flap
    const START = 0.3; // flaps start turning
    const LOCK = [0.35, 0.55, 0.75, 0.95, 1.15]; // each cell lands (scene-local); SFX sit on these
    const cells = [0, 1, 2, 3, 4].map((i) => document.getElementById("board-c" + i));

    // Seek-safe: every frame is computed from the playhead, never from state
    const clock = { t: 0 };
    tl.fromTo(
      clock,
      { t: 0 },
      {
        t: 3.3,
        duration: 3.3,
        ease: "none",
        onUpdate: () => {
          const t = clock.t;
          cells.forEach((el, i) => {
            const lockAt = START + LOCK[i];
            if (t < START) {
              el.textContent = " ";
              el.style.transform = "scaleY(1)";
            } else if (t < lockAt) {
              const n = Math.floor((t - START) / FLIP);
              el.textContent = GLYPHS[(n * 7 + i * 11) % GLYPHS.length];
              const phase = ((t - START) % FLIP) / FLIP;
              el.style.transform = "scaleY(" + (0.35 + 0.65 * Math.abs(Math.cos(phase * Math.PI))).toFixed(3) + ")";
            } else {
              el.textContent = WORD[i];
              const settle = Math.min(1, (t - lockAt) / 0.08);
              el.style.transform = "scaleY(" + (0.6 + 0.4 * settle).toFixed(3) + ")";
            }
          });
        },
      },
      0,
    );

    tl.fromTo("#board-panel", { y: -50, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.36, ease: "expo.out" }, 0.05);
    tl.fromTo("#board-led", { opacity: 1 }, { opacity: 0.2, duration: 0.3, ease: "steps(1)", yoyo: true, repeat: 9 }, 0.4);
    tl.fromTo("#board-bye", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.15);
    window.__timelines["board"] = tl;
  </script>
</template>
