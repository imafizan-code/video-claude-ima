    <style>
      /* "Struk Gepuk": receipt paper, chili red, leaf-green tile, pandan lime, dessert pink. */
      :root {
        --cabe: #e63b2e;
        --daun: #1e5b3a;
        --kertas: #fff6e3;
        --tinta: #1a1410;
        --pandan: #b6f04a;
        --ros: #ff4fa3;
        --kunyit: #ffc21a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--tinta);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--tinta);
      }
      .vw {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .vw video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1 -> hook: settle from 1.14, punch on the stamp (0.55 s), whip up into the room.
      tl.fromTo("#w1", { scale: 1.14 }, { scale: 1.04, duration: 0.5, ease: "expo.out" }, 0);
      tl.set("#w1", { scale: 1.13 }, 0.55);
      tl.fromTo("#w1", { x: -14 }, { x: 0, duration: 0.1, ease: "steps(3)" }, 0.55);
      tl.to("#w1", { y: -620, duration: 0.2, ease: "power3.in" }, 1.887);
      tl.fromTo("#w2", { y: 620 }, { y: 0, duration: 0.3, ease: "power3.out" }, 2.087);

      // Wall pan: hard cut with a slight settle.
      tl.fromTo("#w3", { scale: 1.1 }, { scale: 1.0, duration: 0.4, ease: "expo.out" }, 3.13);

      // Menu: settle, then the receipt line becomes the next frame (handled in scenes).
      tl.fromTo("#w4", { scale: 1.08 }, { scale: 1.0, duration: 0.5, ease: "expo.out" }, 4.174);

      // Gepuk Ori reveal comes up from inside the red panel.
      tl.fromTo("#w5", { scale: 1.18 }, { scale: 1.02, duration: 0.7, ease: "expo.out" }, 6.261);
      tl.to("#w5", { scale: 1.1, duration: 0.12, ease: "power2.out" }, 7.45);

      // Top-down after the camera flash.
      tl.fromTo("#w6", { scale: 1.12 }, { scale: 1.0, duration: 0.5, ease: "expo.out" }, 10.434);
      // Push whips: outgoing and incoming move together, crossing the cut on the beat.
      tl.to("#w6", { x: -1080, duration: 0.3, ease: "power3.inOut" }, 12.373);
      tl.fromTo("#w7", { x: 1080 }, { x: 0, duration: 0.3, ease: "power3.inOut" }, 12.373);
      tl.to("#w7", { x: -1080, duration: 0.3, ease: "power3.inOut" }, 14.459);
      tl.fromTo("#w8", { x: 1080 }, { x: 0, duration: 0.3, ease: "power3.inOut" }, 14.459);

      // Bakso after a dip cut.
      tl.fromTo("#w9", { scale: 1.12 }, { scale: 1.0, duration: 0.5, ease: "expo.out" }, 16.696);

      // Dessert: scoop shot punches in on the cut.
      tl.fromTo("#w11", { scale: 1.16 }, { scale: 1.0, duration: 0.45, ease: "expo.out" }, 22.957);

      // Outro plate drifts under the receipt (footage plays; the camera holds).
      tl.fromTo("#w12", { scale: 1.1 }, { scale: 1.0, duration: 0.6, ease: "expo.out" }, 25.565);

      window.__timelines["main"] = tl;
    </script>
