<html
  data-composition-variables='[
    {"id":"hook-kicker","type":"string","label":"Hook kicker","default":"AMARAN!"},
    {"id":"hook-line1","type":"string","label":"Hook line 1","default":"JANGAN SCROLL"},
    {"id":"hook-line2","type":"string","label":"Hook line 2","default":"KALAU LAPAR"},
    {"id":"hook-stamp","type":"string","label":"Hook stamp","default":"BERBALOI KE?"}
  ]'
>
  <template>
    <style>
      #root {
        position: absolute;
        inset: 0;
        --cabe: #e63b2e;
        --kertas: #fff6e3;
        --tinta: #1a1410;
        --kunyit: #ffc21a;
      }
      #hook-scrim {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1100px;
        background: linear-gradient(180deg, rgba(26, 20, 16, 0.72) 0%, rgba(26, 20, 16, 0.45) 55%, rgba(26, 20, 16, 0) 100%);
      }
      #hook-group {
        position: absolute;
        left: 0;
        top: 220px;
        width: 1080px;
        text-align: center;
      }
      #hook-kicker {
        display: inline-block;
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 52px;
        letter-spacing: 0.12em;
        color: var(--kertas);
        background: var(--cabe);
        padding: 10px 26px 8px;
        transform: rotate(-2deg);
      }
      .hook-big {
        display: block;
        font-family: "League Gothic", sans-serif;
        font-size: 190px;
        line-height: 0.95;
        letter-spacing: 0.01em;
        color: var(--kertas);
        text-shadow: 10px 10px 0 var(--tinta);
      }
      #hook-stamp-wrap {
        position: absolute;
        left: 0;
        top: 1120px;
        width: 1080px;
        text-align: center;
      }
      #hook-stamp {
        display: inline-block;
        font-family: "Archivo Black", sans-serif;
        font-size: 76px;
        line-height: 1;
        color: var(--cabe);
        background: var(--kertas);
        border: 9px solid var(--cabe);
        outline: 4px solid var(--kertas);
        padding: 18px 34px 14px;
        border-radius: 14px;
        opacity: 0;
      }
    </style>
    <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
      <div id="hook-scrim"></div>
      <div id="hook-group">
        <span id="hook-kicker" data-var-text="hook-kicker">AMARAN!</span>
        <span class="hook-big" id="hook-l1" data-var-text="hook-line1">JANGAN SCROLL</span>
        <span class="hook-big" id="hook-l2" data-var-text="hook-line2">KALAU LAPAR</span>
      </div>
      <div id="hook-stamp-wrap">
        <span id="hook-stamp" data-var-text="hook-stamp">BERBALOI KE?</span>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Frame 0 is the thumbnail: the warning is already on screen; line 2 turns yellow on the first cut.
      tl.fromTo(".hook-big", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "expo.out" }, 0);
      tl.fromTo("#hook-l2", { color: "#fff6e3" }, { color: "#ffc21a", duration: 0.01, ease: "none" }, 0.261);
      // Rubber stamp slams on beat 2 (1.043 s).
      tl.fromTo(
        "#hook-stamp",
        { opacity: 0, scale: 2.3, rotation: -16 },
        { opacity: 1, scale: 1, rotation: -7, duration: 0.17, ease: "power4.in" },
        0.873,
      );
      tl.fromTo("#hook-group", { x: -10, y: 6 }, { x: 0, y: 0, duration: 0.1, ease: "steps(3)" }, 1.043);
      // Leave with the whip.
      tl.to(["#hook-group", "#hook-stamp-wrap"], { y: -520, duration: 0.2, ease: "power3.in" }, 1.887);
      tl.to("#hook-scrim", { opacity: 0, duration: 0.2, ease: "power2.in" }, 1.887);
      window.__timelines["hook"] = tl;
    </script>
  </template>
</html>
