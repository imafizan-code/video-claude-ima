<html
  data-composition-variables='[
    {"id":"place-name","type":"string","label":"Restaurant name","default":"AYAM GEPUK MAS RIO"},
    {"id":"place-line","type":"string","label":"Second line","default":"deco cantik, colorful 😍"}
  ]'
>
  <template>
    <style>
      #root {
        position: absolute;
        inset: 0;
        --cabe: #e63b2e;
        --kertas: #fff6e3;
        --tinta: #1a1410;
        --pandan: #b6f04a;
      }
      #place-box {
        position: absolute;
        left: 60px;
        top: 250px;
        width: 860px;
      }
      #place-pin {
        position: absolute;
        left: 0;
        top: 0;
        width: 92px;
        height: 120px;
      }
      #place-tape {
        position: absolute;
        left: 104px;
        top: 18px;
        background: var(--kertas);
        padding: 16px 26px 12px;
        box-shadow: 8px 8px 0 var(--tinta);
        white-space: nowrap;
      }
      #place-name {
        font-family: "Archivo Black", sans-serif;
        font-size: 54px;
        line-height: 1;
        color: var(--tinta);
      }
      #place-name .ch {
        display: inline-block;
      }
      #place-line {
        position: absolute;
        left: 120px;
        top: 150px;
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 40px;
        color: var(--tinta);
        background: var(--pandan);
        padding: 6px 18px 4px;
        transform: rotate(1.5deg);
        white-space: nowrap;
      }
    </style>
    <div id="root" data-composition-id="place" data-width="1080" data-height="1920">
      <div id="place-box">
        <svg id="place-pin" viewBox="0 0 92 120" aria-hidden="true">
          <path d="M46 4C23 4 6 21 6 43c0 30 40 70 40 70s40-40 40-70C86 21 69 4 46 4z" fill="#e63b2e" stroke="#1a1410" stroke-width="6" />
          <circle cx="46" cy="43" r="14" fill="#fff6e3" stroke="#1a1410" stroke-width="5" />
        </svg>
        <div id="place-tape"><div id="place-name" data-var-text="place-name">AYAM GEPUK MAS RIO</div></div>
        <div id="place-line" data-var-text="place-line">deco cantik, colorful 😍</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Split the name into letters once at init (deterministic).
      const nameEl = document.querySelector("#place-name");
      const txt = nameEl.textContent;
      nameEl.textContent = "";
      for (const c of txt) {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = c === " " ? " " : c;
        nameEl.appendChild(s);
      }
      tl.fromTo("#place-pin", { y: -160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 0);
      tl.fromTo("#place-tape", { scaleX: 0, rotation: -2, transformOrigin: "0% 50%" }, { scaleX: 1, rotation: -2, duration: 0.25, ease: "expo.out" }, 0.12);
      tl.fromTo(
        "#place-name .ch",
        { opacity: 0.15, filter: "blur(4px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.12, stagger: 0.025, ease: "power2.out" },
        0.18,
      );
      tl.fromTo("#place-line", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 1.943);
      tl.to("#place-box", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 4.007);
      window.__timelines["place"] = tl;
    </script>
  </template>
</html>
