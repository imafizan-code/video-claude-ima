<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Space Impact</title>
<style>
  :root{--body:#2a3a5c;--body2:#1d2942;--lcd:#9db38a;--ink:#1c2b19}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  html,body{margin:0;height:100%;background:#0d1220;font-family:system-ui,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  .phone{width:min(100vw,560px);max-height:100vh;padding:14px 14px 18px;background:linear-gradient(160deg,var(--body),var(--body2));border-radius:28px;box-shadow:0 0 0 3px #0008 inset,0 20px 50px #000a;display:flex;flex-direction:column;gap:14px}
  .brand{color:#c8d3ea;text-align:center;font-size:12px;letter-spacing:.35em;opacity:.8}
  .screen{background:#10161f;padding:10px;border-radius:12px;box-shadow:0 0 0 2px #000 inset}
  canvas{display:block;width:100%;height:auto;aspect-ratio:84/48;background:var(--lcd);image-rendering:pixelated;border-radius:3px}
  .pad{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:150px;height:150px;gap:4px}
  .dpad button{border-radius:12px}
  .acts{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  button{border:0;background:#4b5f8f;color:#e8eefc;font-weight:700;font-size:18px;border-radius:50%;box-shadow:0 4px 0 #1b2744;touch-action:none}
  button:active,button.on{transform:translateY(3px);box-shadow:0 1px 0 #1b2744;background:#6a82bb}
  .fire{width:104px;height:104px}
  .msl{width:80px;height:48px;border-radius:24px;font-size:14px}
  .hint{color:#8fa0c4;font-size:11px;text-align:center;line-height:1.5}
  @media (min-width:700px){.hint{display:block}}
  @media (pointer:fine){.pad{display:none}}
  @media (pointer:coarse){.hint{display:none}}
  @media (max-height:640px) and (pointer:coarse){.phone{padding:8px;gap:8px}.dpad{width:110px;height:110px}.fire{width:80px;height:80px}.brand{display:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="brand">SPACE IMPACT</div>
  <div class="screen"><canvas id="c" width="672" height="384"></canvas></div>
  <div class="pad">
    <div class="dpad">
      <span></span><button data-k="up">▲</button><span></span>
      <button data-k="left">◀</button><span></span><button data-k="right">▶</button>
      <span></span><button data-k="down">▼</button><span></span>
    </div>
    <div class="acts">
      <button class="msl" data-k="missile">MISIL</button>
      <button class="fire" data-k="fire">TEMBAK</button>
    </div>
  </div>
  <div class="hint">Anak panah / WASD = gerak · SPACE / Z = tembak (tahan) · X = misil · P = jeda · M = bunyi</div>
</div>

<script>
"use strict";
// ---------- Skrin LCD gaya Nokia (84x48) ----------
const W = 84, H = 48, S = 8;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const buf = new Uint8Array(W * H);
const LCD_OFF = '#97ad84', LCD_ON = '#1c2b19';
function flush() {
  ctx.fillStyle = LCD_OFF; ctx.fillRect(0, 0, W * S, H * S);
  ctx.fillStyle = LCD_ON;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    if (buf[y * W + x]) ctx.fillRect(x * S, y * S, S - 1, S - 1);
}
const px = (x, y) => { x |= 0; y |= 0; if (x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = 1; };
const rect = (x, y, w, h) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j); };
const hline = (x, y, w) => rect(x, y, w, 1);

// ---------- Sprite ----------
const art = rows => { const w = Math.max(...rows.map(r => r.length)); return { w, h: rows.length, rows: rows.map(r => r.padEnd(w, '.')) }; };
function spr(a, x, y) { x |= 0; y |= 0; for (let j = 0; j < a.h; j++) for (let i = 0; i < a.w; i++) if (a.rows[j][i] === '#') px(x + i, y + j); }
const SHIP = art(['##.......', '.####....', '.#######.', '.####....', '##.......']);
const E_WAVE = art(['..###..', '.#####.', '##.#.##', '.#####.', '..#.#..']);
const E_DART = art(['...##..', '.####..', '#######', '.####..', '...##..']);
const E_GUN = art(['.#####.', '#######', '##.#.##', '#######', '.##.##.', '#.....#']);
const E_TANK = art(['.#####.', '#######', '#.###.#', '#######', '#######', '.#.#.#.']);
const BOSS = art([
  '......####......', '....########....', '..############..', '.##.########.##.',
  '####.######.####', '################', '.####..##..####.', '..###.####.###..',
  '.####..##..####.', '################', '####.######.####', '.##.########.##.',
  '..############..', '....########....']);
const HEART = art(['.#.#.', '#####', '#####', '.###.', '..#..']);
const P_MSL = art(['.###.', '#.#.#', '#####', '#.#.#', '.###.']);
const P_PWR = art(['#####', '#.#.#', '#####', '#.#.#', '#####']);
const P_LIFE = art(['#####', '##.##', '#...#', '##.##', '#####']);
const MSL = art(['..#..', '#####', '..#..']);

// ---------- Fon 3x5 ----------
const F = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001001010010', '8': '111101111101111', '9': '111101111001111',
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', F: '111100110100100',
  G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
  M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100', Q: '010101101111011', R: '110101110101101',
  S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
  Y: '101101010010010', Z: '111001010100111', '-': '000000111000000', ':': '000010000010000', '!': '010010010000010', ' ': '000000000000000', 'x': '000101010101000'
};
function txt(s, x, y) { s = String(s).toUpperCase(); for (const ch of s) { const g = F[ch] || F[' ']; for (let i = 0; i < 15; i++) if (g[i] === '1') px(x + i % 3, y + (i / 3 | 0)); x += 4; } }
const tw = s => String(s).length * 4 - 1;
const ctr = (s, y) => txt(s, ((W - tw(s)) / 2) | 0, y);

// ---------- Bunyi ----------
let AC = null, muted = false;
function beep(f, d = .06, type = 'square', v = .05, slide = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), AC.currentTime + d);
    g.gain.value = v; g.gain.linearRampToValueAtTime(0, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const sfx = {
  shoot: () => beep(880, .04, 'square', .03, -300), boom: () => beep(160, .18, 'sawtooth', .06, -120),
  hit: () => beep(300, .05), pick: () => { beep(660, .06); setTimeout(() => beep(990, .08), 60); },
  die: () => beep(300, .6, 'sawtooth', .07, -260), msl: () => beep(200, .25, 'sawtooth', .06, 500),
  bossDie: () => { for (let i = 0; i < 6; i++) setTimeout(() => beep(200 - i * 20, .2, 'sawtooth', .07), i * 120); }
};

// ---------- Input ----------
const keys = {};
const MAP = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ' ': 'fire', z: 'fire', Z: 'fire', x: 'missile', X: 'missile', Enter: 'fire' };
let pressed = {};
addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') { if (state === 'play') paused = !paused; return; }
  if (e.key === 'm' || e.key === 'M') { muted = !muted; return; }
  const k = MAP[e.key]; if (!k) return; e.preventDefault();
  if (!keys[k]) pressed[k] = true; keys[k] = true;
});
addEventListener('keyup', e => { const k = MAP[e.key]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') paused = true; });
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.setPointerCapture(e.pointerId); if (!keys[k]) pressed[k] = true; keys[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
cv.addEventListener('pointerdown', () => { pressed.fire = true; if (state === 'play' && paused) paused = false; });

// ---------- Permainan ----------
let hi = 0;
try { hi = +localStorage.getItem('si_hi') || 0; } catch (e) {}
let state = 'title', paused = false, tick = 0, stateT = 0;
let P, bullets, enemies, ebullets, pickups, parts, boss;
let score, level, phase, remaining, spawnT, bannerT, shake = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const hit = (a, aw, ah, b, bw, bh) => a.x < b.x + bw && a.x + aw > b.x && a.y < b.y + bh && a.y + ah > b.y;

function newGame() {
  P = { x: 4, y: 24, cd: 0, lives: 3, missiles: 3, power: 0, inv: 60 };
  bullets = []; enemies = []; ebullets = []; pickups = []; parts = []; boss = null;
  score = 0; level = 1; startLevel(); state = 'play'; paused = false;
}
function startLevel() {
  phase = 'waves'; remaining = 10 + level * 4; spawnT = 40; bannerT = 50;
  ebullets = []; boss = null;
}
function explode(x, y, n = 8, spd = 1.4) {
  for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), s = rnd(.3, spd); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: rnd(6, 16) }); }
}
function spawnFormation() {
  const roll = Math.random(), y0 = rnd(12, 36);
  const lvlSpd = 1 + Math.min(level, 8) * .06;
  if (roll < .38) { const n = 4; for (let i = 0; i < n; i++) enemies.push({ t: 0, type: 'wave', x: W + i * 10, y: y0, y0, hp: 1, spd: .55 * lvlSpd, w: 7, h: 5, ph: -i * 1.1 }); remaining -= n; }
  else if (roll < .62) { const n = level > 1 ? 2 : 1; for (let i = 0; i < n; i++) enemies.push({ t: 0, type: 'dart', x: W + i * 14, y: rnd(10, 38), hp: 1, spd: 1.1 * lvlSpd, w: 7, h: 5 }); remaining -= n; }
  else if (roll < .86 || level < 2) { enemies.push({ t: 0, type: 'gun', x: W, y: rnd(10, 36), hp: 3, spd: .6, w: 7, h: 6, hx: rnd(48, 66), cd: 20 }); remaining -= 1; }
  else { enemies.push({ t: 0, type: 'tank', x: W, y: rnd(10, 34), hp: 6 + level, spd: .3, w: 7, h: 6, cd: 30 }); remaining -= 1; }
  spawnT = Math.max(28, 80 - level * 5) + rnd(0, 20);
}
function spawnBoss() {
  phase = 'boss'; bannerT = 50;
  boss = { x: W + 4, y: 18, w: BOSS.w, h: BOSS.h, hp: 25 + level * 12, max: 25 + level * 12, t: 0, cd: 40, dir: 1 };
}
function fire(x, y, vx, vy = 0) { ebullets.push({ x, y, vx, vy }); }
function drop(x, y) {
  const r = Math.random();
  if (r < .10) pickups.push({ x, y, k: 'msl' });
  else if (r < .17) pickups.push({ x, y, k: 'pwr' });
  else if (r < .20) pickups.push({ x, y, k: 'life' });
}
function killEnemy(e) {
  explode(e.x + 3, e.y + 3); sfx.boom();
  score += e.type === 'tank' ? 40 : e.type === 'gun' ? 25 : e.type === 'dart' ? 15 : 10;
  drop(e.x, e.y);
}
function hurtPlayer() {
  if (P.inv > 0) return;
  P.lives--; P.power = 0; P.inv = 70; explode(P.x + 4, P.y + 2, 18, 2); sfx.die(); shake = 8;
  if (P.lives <= 0) { state = 'over'; stateT = 0; if (score > hi) { hi = score; try { localStorage.setItem('si_hi', hi); } catch (e) {} } }
}

function update() {
  tick++; stateT++;
  if (state === 'title') { if (pressed.fire || pressed.missile) newGame(); return; }
  if (state === 'over') { if (stateT > 45 && pressed.fire) newGame(); return; }
  if (paused) return;

  // pemain
  const sp = 1.5;
  if (keys.left) P.x -= sp; if (keys.right) P.x += sp; if (keys.up) P.y -= sp; if (keys.down) P.y += sp;
  P.x = Math.max(0, Math.min(W - SHIP.w - 20, P.x)); P.y = Math.max(8, Math.min(H - SHIP.h - 1, P.y));
  if (P.cd > 0) P.cd--; if (P.inv > 0) P.inv--;
  if (keys.fire && P.cd <= 0) {
    const bx = P.x + SHIP.w, by = P.y + 2;
    bullets.push({ x: bx, y: by, vx: 3.2, vy: 0, d: 1, w: 2, h: 1 });
    if (P.power > 0) { bullets.push({ x: bx - 2, y: by - 3, vx: 3, vy: -.35, d: 1, w: 2, h: 1 }); bullets.push({ x: bx - 2, y: by + 3, vx: 3, vy: .35, d: 1, w: 2, h: 1 }); }
    P.cd = P.power > 0 ? 6 : 7; sfx.shoot();
  }
  if (P.power > 0 && tick % 30 === 0) P.power--;
  if (pressed.missile && P.missiles > 0) { P.missiles--; bullets.push({ x: P.x + SHIP.w, y: P.y + 1, vx: 2.4, vy: 0, d: 8, w: 5, h: 3, msl: true }); sfx.msl(); }

  // peluru
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.x < W + 6 && b.y > 5 && b.y < H);

  // spawn
  if (phase === 'waves') {
    if (bannerT > 0) bannerT--;
    else if (remaining > 0 && --spawnT <= 0) spawnFormation();
    else if (remaining <= 0 && enemies.length === 0) spawnBoss();
  } else if (phase === 'boss' && bannerT > 0) bannerT--;
  else if (phase === 'clear') { if (--bannerT <= 0) { level++; startLevel(); } }

  // musuh
  for (const e of enemies) {
    e.t++;
    if (e.type === 'wave') { e.x -= e.spd; e.y = e.y0 + Math.sin(e.t * .12 + e.ph) * 11; }
    else if (e.type === 'dart') { e.x -= e.spd; if (e.x > 30) e.y += Math.sign(P.y - e.y) * .35; }
    else if (e.type === 'gun') {
      if (e.x > e.hx) e.x -= e.spd; else { e.y += Math.sin(e.t * .08) * .5; if (e.t % 5 === 0 && e.t > 200) e.x -= .2; }
      if (e.x <= e.hx && --e.cd <= 0) { fire(e.x, e.y + 2, -1.3, Math.sign(P.y - e.y) * .25); e.cd = Math.max(26, 50 - level * 3); }
    } else if (e.type === 'tank') {
      e.x -= e.spd;
      if (--e.cd <= 0) { fire(e.x, e.y + 1, -1.2, -.35); fire(e.x, e.y + 2, -1.2, 0); fire(e.x, e.y + 4, -1.2, .35); e.cd = 55; }
    }
    e.y = Math.max(8, Math.min(H - e.h - 1, e.y));
    // vs peluru pemain
    for (const b of bullets) if (b.d && hit(b, b.w, b.h, e, e.w, e.h)) {
      e.hp -= b.d; if (!b.msl) b.d = 0; sfx.hit(); explode(b.x, b.y, 2, .8);
    }
    if (e.hp > 0 && hit(P, SHIP.w, SHIP.h, e, e.w, e.h) && P.inv <= 0) { e.hp = 0; hurtPlayer(); }
    if (e.hp <= 0 && !e.dead) { e.dead = true; killEnemy(e); }
  }
  bullets = bullets.filter(b => b.d > 0);
  enemies = enemies.filter(e => !e.dead && e.x > -10);

  // bos
  if (boss) {
    const B = boss; B.t++;
    if (B.x > W - 26) B.x -= .6;
    else {
      B.y += B.dir * (.35 + level * .03); if (B.y < 8 || B.y > H - B.h - 1) B.dir *= -1;
      if (--B.cd <= 0) {
        const m = (B.t / 60 | 0) % 3;
        const cy = B.y + B.h / 2;
        if (m === 0) { for (let i = -2; i <= 2; i++) fire(B.x, cy, -1.2, i * .3); }
        else if (m === 1) { const dy = (P.y + 2 - cy) / ((B.x - P.x) / 1.6); fire(B.x, cy - 3, -1.6, dy); fire(B.x, cy + 3, -1.6, dy); fire(B.x, cy, -1.6, dy); }
        else { fire(B.x, B.y + 1, -1.4, .2); fire(B.x, B.y + B.h - 2, -1.4, -.2); }
        B.cd = Math.max(22, 48 - level * 3);
      }
    }
    for (const b of bullets) if (b.d && hit(b, b.w, b.h, B, B.w, B.h)) { B.hp -= b.d; if (!b.msl) b.d = 0; sfx.hit(); explode(b.x, b.y, 2, .8); }
    bullets = bullets.filter(b => b.d > 0);
    if (hit(P, SHIP.w, SHIP.h, B, B.w, B.h)) hurtPlayer();
    if (B.hp <= 0) {
      for (let i = 0; i < 5; i++) explode(B.x + rnd(0, B.w), B.y + rnd(0, B.h), 12, 2);
      sfx.bossDie(); score += 200 + level * 100; shake = 14;
      pickups.push({ x: B.x, y: B.y + 4, k: 'life' }, { x: B.x + 4, y: B.y + 8, k: 'msl' });
      boss = null; phase = 'clear'; bannerT = 90; ebullets = [];
    }
  }

  // peluru musuh
  for (const b of ebullets) { b.x += b.vx; b.y += b.vy; if (hit(b, 2, 2, P, SHIP.w, SHIP.h)) { b.dead = true; hurtPlayer(); } }
  ebullets = ebullets.filter(b => !b.dead && b.x > -3 && b.y > 5 && b.y < H);

  // pickup
  for (const p of pickups) {
    p.x -= .5;
    if (hit(p, 5, 5, P, SHIP.w, SHIP.h)) {
      p.dead = true; sfx.pick(); score += 5;
      if (p.k === 'msl') P.missiles = Math.min(9, P.missiles + 2);
      else if (p.k === 'pwr') P.power = 20;
      else P.lives = Math.min(5, P.lives + 1);
    }
  }
  pickups = pickups.filter(p => !p.dead && p.x > -6);

  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.l--; }
  parts = parts.filter(p => p.l > 0);
  if (shake > 0) shake--;
}

function draw() {
  buf.fill(0);
  if (state === 'title') {
    ctr('SPACE', 5); ctr('IMPACT', 12);
    hline(14, 19, 56); hline(14, 21, 56);
    spr(SHIP, 8 + ((tick / 2) % 60 | 0), 27);
    if ((tick / 15 | 0) % 2 === 0) ctr('TEKAN TEMBAK', 37);
    ctr('HI ' + hi, 43);
    flush(); return;
  }
  const ox = shake ? (Math.random() * 2 - 1) * 1 | 0 : 0;
  // HUD
  txt(String(score).padStart(5, '0'), 1, 1);
  txt('M' + P.missiles, 28, 1);
  if (P.power > 0) txt('P', 38, 1);
  for (let i = 0; i < P.lives; i++) spr(HEART, W - 6 * (i + 1), 1);
  hline(0, 6, W);

  if (state !== 'over' || stateT < 20) if (P.inv <= 0 || (tick >> 1) % 2 === 0 || state === 'over') if (P.lives > 0) spr(SHIP, P.x + ox, P.y);
  for (const e of enemies) spr({ wave: E_WAVE, dart: E_DART, gun: E_GUN, tank: E_TANK }[e.type], e.x + ox, e.y);
  if (boss) {
    if (boss.t % 4 < 3 || boss.hp > 8) spr(BOSS, boss.x + ox, boss.y);
    hline(W - 1 - Math.round(boss.hp / boss.max * 30), H - 1, Math.round(boss.hp / boss.max * 30));
  }
  for (const b of bullets) { if (b.msl) spr(MSL, b.x, b.y); else rect(b.x, b.y, 2, 1); }
  for (const b of ebullets) rect(b.x, b.y, 2, 2);
  for (const p of pickups) if ((tick >> 2) % 2 === 0 || true) spr({ msl: P_MSL, pwr: P_PWR, life: P_LIFE }[p.k], p.x, p.y);
  for (const p of parts) px(p.x, p.y);

  if (bannerT > 0 && phase === 'waves') { ctr('LEVEL ' + level, 20); }
  if (bannerT > 0 && phase === 'boss') { if ((tick >> 2) % 2) ctr('BOS!', 20); }
  if (phase === 'clear') { ctr('LEVEL ' + level, 17); ctr('SELESAI!', 24); }
  if (paused) { rect(26, 17, 32, 13); for (let y = 18; y < 29; y++) for (let x = 27; x < 57; x++) buf[y * W + x] = 0; ctr('JEDA', 21); }
  if (state === 'over') {
    rect(14, 12, 56, 26); for (let y = 13; y < 37; y++) for (let x = 15; x < 69; x++) buf[y * W + x] = 0;
    ctr('TAMAT', 15); ctr('SKOR ' + score, 22); ctr('HI ' + hi, 28);
    if (stateT > 45 && (tick / 15 | 0) % 2 === 0) ctr('SEKALI LAGI', 33);
  }
  flush();
}

// gelung tetap 30 Hz
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 30) { update(); pressed = {}; acc -= 1000 / 30; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
