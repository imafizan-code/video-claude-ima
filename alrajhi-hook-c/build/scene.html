<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #1B1340; --indigo: #3B2BD9; --indigo2: #6A5CFF; --yellow: #FFC93C;
    --pink: #FF7AA8; --green: #1FAF7A; --red: #F0445A; --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 720px; height: 1280px; overflow: hidden; background: #000; }
  body { font-family: 'Inter Display', 'Inter', 'DejaVu Sans', sans-serif; color: var(--ink); }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .abs { position: absolute; }
  .bg-peach { background: radial-gradient(circle at 50% 35%, #FFF4E8, #FFD9B8); }
  .bg-lav { background: radial-gradient(circle at 50% 35%, #F6F3FF, #DCD5FF); }
  .bg-mint { background: radial-gradient(circle at 50% 35%, #F0FFF8, #C8F0DF); }
  .bg-sky { background: radial-gradient(circle at 50% 35%, #F2F8FF, #CFE3FF); }
  .bg-ind { background: radial-gradient(circle at 50% 30%, #5B4CF0, #2A1E9E); }
  .dots { position: absolute; inset: 0; opacity: .18;
    background-image: radial-gradient(var(--ink) 2px, transparent 2.5px); background-size: 36px 36px; }

  /* animation helpers: delays are relative to the scene start */
  .a { animation-fill-mode: both; animation-delay: var(--d, 0s); animation-timing-function: cubic-bezier(.2,.9,.3,1.25); }
  .pop { animation-name: pop; animation-duration: .5s; }
  .slideL { animation-name: slideL; animation-duration: .6s; }
  .slideR { animation-name: slideR; animation-duration: .6s; }
  .up { animation-name: up; animation-duration: .55s; }
  .fade { animation-name: fade; animation-duration: .4s; animation-timing-function: ease; }
  .stamp { animation-name: stamp; animation-duration: .45s; }
  .bob { animation: bob 2.2s ease-in-out infinite; }
  .bob2 { animation: bob 1.6s ease-in-out infinite; animation-delay: -.5s; }
  .pulse { animation: pulse 1.8s ease-out infinite; }
  .spin { animation: spin 6s linear infinite; }
  .wave { animation: wave .9s ease-in-out infinite; transform-origin: 30% 90%; }
  .bounce { animation: bounce .9s ease-in-out infinite; }
  .fly { animation-name: fly; animation-duration: 1.1s; animation-timing-function: cubic-bezier(.5,0,.3,1); }
  .draw { stroke-dasharray: 120; animation-name: draw; animation-duration: .5s; animation-timing-function: ease-out; }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes slideL { 0% { transform: translateX(-420px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes slideR { 0% { transform: translateX(420px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes up { 0% { transform: translateY(60px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes fade { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes stamp { 0% { transform: scale(2.4) rotate(-14deg); opacity: 0; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes pulse { 0% { transform: scale(.85); opacity: .7; } 100% { transform: scale(1.45); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes wave { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(14deg); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(16px); } }
  @keyframes fly { 0% { transform: translate(0,0) scale(.7); opacity: 0; } 12% { opacity: 1; }
    85% { opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(.45); opacity: 0; } }
  @keyframes draw { 0% { stroke-dashoffset: 120; } 100% { stroke-dashoffset: 0; } }

  .person { width: 100%; height: 100%; overflow: visible; }
  .chip { display: inline-block; padding: 14px 26px; border-radius: 999px; font-weight: 900; font-size: 34px;
    background: var(--white); border: 5px solid var(--ink); box-shadow: 0 7px 0 var(--ink); white-space: nowrap; }
  .chip.y { background: var(--yellow); }
  .chip.g { background: var(--green); color: #fff; }
  .chip.i { background: var(--indigo); color: #fff; }
  .card { background: #fff; border: 5px solid var(--ink); border-radius: 30px; box-shadow: 0 9px 0 var(--ink); }

  /* placeholder for the real MY alrajhi app screen recording */
  .phone { position: absolute; border: 14px solid var(--ink); border-radius: 46px; background: var(--ink); box-shadow: 0 14px 0 rgba(27,19,64,.25); }
  .phone .scr { position: absolute; inset: 0; border-radius: 32px; overflow: hidden;
    background: repeating-linear-gradient(45deg, #EEF0F7 0 22px, #E2E5F0 22px 44px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 18px; }
  .phone .notch { position: absolute; top: 10px; left: 50%; width: 34%; height: 20px; margin-left: -17%; background: var(--ink); border-radius: 12px; z-index: 2; }
  .rec { font-weight: 900; font-size: 22px; letter-spacing: 1px; color: var(--red); display: flex; align-items: center; gap: 8px; }
  .rec i { width: 16px; height: 16px; border-radius: 50%; background: var(--red); display: inline-block; }
  .phone .lbl { margin-top: 14px; font-weight: 800; font-size: 25px; line-height: 1.25; color: var(--ink); }
  .phone .hint { margin-top: 10px; font-weight: 600; font-size: 18px; line-height: 1.3; color: #5a5680; }
  .play { width: 0; height: 0; border-left: 34px solid var(--indigo); border-top: 22px solid transparent; border-bottom: 22px solid transparent; margin-bottom: 14px; }

  .step { position: absolute; left: 350px; width: 340px; display: flex; align-items: center; gap: 16px; padding: 18px 20px; }
  .step .n { flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--indigo); color: #fff;
    font-weight: 900; font-size: 32px; display: flex; align-items: center; justify-content: center; border: 4px solid var(--ink); }
  .step .t { font-weight: 800; font-size: 27px; line-height: 1.15; }

  #sub { position: absolute; z-index: 100; left: 30px; right: 30px; top: 1010px; text-align: center; font-weight: 900; font-size: 56px;
    line-height: 1.12; color: #fff; -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill; text-transform: uppercase; }
  #sub b { color: var(--yellow); }
  #sub .w { display: inline-block; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="sub"></div>

<script>
// ---------- characters ----------
// arm: 'down' | 'phone' | 'point' | 'wave' | 'up2'
function person({ skin = '#F3C9A6', shirt = '#3B2BD9', hijab = null, hair = '#3A2A22', arm = 'down', spk = false, flip = false }) {
  const head = hijab
    ? `<path d="M100 38 C42 38 34 108 40 150 C46 196 72 214 100 214 C128 214 154 196 160 150 C166 108 158 38 100 38Z" fill="${hijab}"/>
       <path d="M44 150 Q36 250 100 262 Q164 250 156 150 Q130 205 100 205 Q70 205 44 150Z" fill="${hijab}"/>
       <ellipse cx="100" cy="120" rx="44" ry="50" fill="${skin}"/>`
    : `<circle cx="100" cy="115" r="56" fill="${skin}"/>
       <path d="M44 108 C44 58 74 50 100 50 C134 50 158 64 156 110 C146 86 120 78 100 82 C78 86 58 92 44 108Z" fill="${hair}"/>
       <circle cx="44" cy="122" r="9" fill="${skin}"/><circle cx="156" cy="122" r="9" fill="${skin}"/>`;
  const R = { // right arm (viewer's right)
    down:  `<path d="M150 215 Q178 255 172 300" stroke="${shirt}" stroke-width="24" fill="none" stroke-linecap="round"/><circle cx="172" cy="302" r="13" fill="${skin}"/>`,
    phone: `<path d="M150 215 Q182 250 136 268" stroke="${shirt}" stroke-width="24" fill="none" stroke-linecap="round"/>
            <rect x="104" y="226" width="40" height="66" rx="8" fill="#1B1340"/><rect x="109" y="233" width="30" height="50" rx="4" fill="#9FD8FF"/>
            <circle cx="138" cy="268" r="13" fill="${skin}"/>`,
    point: `<path d="M150 215 Q196 196 214 150" stroke="${shirt}" stroke-width="24" fill="none" stroke-linecap="round"/><circle cx="216" cy="146" r="13" fill="${skin}"/>`,
    wave:  `<g class="wave"><path d="M150 215 Q190 190 196 130" stroke="${shirt}" stroke-width="24" fill="none" stroke-linecap="round"/><circle cx="196" cy="124" r="15" fill="${skin}"/></g>`,
    up2:   `<path d="M150 215 Q196 180 200 120" stroke="${shirt}" stroke-width="24" fill="none" stroke-linecap="round"/><circle cx="200" cy="114" r="14" fill="${skin}"/>`,
  }[arm];
  const L = arm === 'up2'
    ? `<path d="M50 215 Q4 180 0 120" stroke="${shirt}" stroke-width="24" fill="none" stroke-linecap="round"/><circle cx="0" cy="114" r="14" fill="${skin}"/>`
    : `<path d="M50 215 Q22 255 28 300" stroke="${shirt}" stroke-width="24" fill="none" stroke-linecap="round"/><circle cx="28" cy="302" r="13" fill="${skin}"/>`;
  return `<svg class="person ${spk ? 'spk' : ''}" viewBox="-20 20 240 330" style="${flip ? 'transform:scaleX(-1)' : ''}">
    <path d="M36 350 Q34 212 100 204 Q166 212 164 350Z" fill="${shirt}"/>
    ${L}
    ${head}
    <g class="eyes"><ellipse cx="82" cy="118" rx="6" ry="8" fill="#1B1340"/><ellipse cx="118" cy="118" rx="6" ry="8" fill="#1B1340"/></g>
    <circle cx="70" cy="140" r="9" fill="#FF8FA8" opacity=".45"/><circle cx="130" cy="140" r="9" fill="#FF8FA8" opacity=".45"/>
    <path class="m0" d="M86 146 Q100 160 114 146" stroke="#1B1340" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse class="m1" cx="100" cy="151" rx="12" ry="10" fill="#7A2236" style="display:none"/>
    ${R}
  </svg>`;
}
const AKU = (o = {}) => person({ hijab: '#FF8FB8', shirt: '#3B2BD9', spk: true, ...o });   // narrator
const KAWAN = (o = {}) => person({ shirt: '#1FAF7A', skin: '#D9A27C', ...o });

const gift = (c = '#FF7AA8', r = '#FFC93C') => `<svg viewBox="0 0 120 120" width="100%" height="100%">
  <rect x="14" y="50" width="92" height="62" rx="8" fill="${c}" stroke="#1B1340" stroke-width="5"/>
  <rect x="8" y="34" width="104" height="24" rx="6" fill="${c}" stroke="#1B1340" stroke-width="5"/>
  <rect x="52" y="34" width="16" height="78" fill="${r}" stroke="#1B1340" stroke-width="4"/>
  <path d="M60 34 C40 6 22 22 40 34 M60 34 C80 6 98 22 80 34" stroke="#1B1340" stroke-width="5" fill="${r}"/></svg>`;
const sparkles = `<svg viewBox="0 0 200 200" width="100%" height="100%" class="spin">
  ${[0, 60, 120, 180, 240, 300].map(a => `<path transform="rotate(${a} 100 100)" d="M100 6 L106 30 L100 40 L94 30Z" fill="#FFC93C" stroke="#1B1340" stroke-width="3"/>`).join('')}</svg>`;
const check = (c = '#1FAF7A', d = '0s') => `<svg viewBox="0 0 60 60" width="100%" height="100%">
  <circle cx="30" cy="30" r="27" fill="${c}" stroke="#1B1340" stroke-width="4"/>
  <path class="a draw" style="--d:${d}" d="M17 31 L27 41 L44 21" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const phonePH = (title, hint) => `<div class="notch"></div><div class="scr"><div class="play"></div>
  <div class="rec"><i></i>SCREEN RECORDING</div><div class="lbl">${title}</div><div class="hint">${hint}</div></div>`;

// ---------- scenes (all delays are seconds from the scene start) ----------
const SCENES = [
// 0 HOOK
`<div class="scene bg-peach" data-bg><div class="dots"></div>
  <div class="abs a pop" style="--d:.1s;left:60px;top:90px;"><span class="chip y" style="font-size:40px">POV: share satu code je</span></div>
  <div class="abs a slideR" style="--d:0s;left:330px;top:390px;width:360px;height:500px"><div class="bob">${KAWAN({ arm: 'phone' })}</div></div>
  <div class="abs a pop" style="--d:.9s;left:400px;top:190px;width:230px;height:230px">${sparkles}</div>
  <div class="abs a pop" style="--d:.8s;left:445px;top:235px;width:140px;height:140px"><div class="bob2">${gift()}</div></div>
  <div class="abs a pop" style="--d:1.6s;left:380px;top:170px"><span class="chip i" style="font-size:28px;transform:rotate(-6deg);display:inline-block">manis-manis!</span></div>
  <div class="abs a slideL" style="--d:.2s;left:10px;top:470px;width:320px;height:450px">${AKU({ arm: 'point' })}</div>
</div>`,
// 1 APP — no counter
`<div class="scene bg-lav"><div class="dots"></div>
  <div class="abs a pop" style="--d:.6s;left:60px;top:120px;width:240px;height:220px">
    <svg viewBox="0 0 240 220" width="100%" height="100%">
      <path d="M20 80 L120 20 L220 80Z" fill="#fff" stroke="#1B1340" stroke-width="6" stroke-linejoin="round"/>
      <rect x="30" y="80" width="180" height="16" fill="#fff" stroke="#1B1340" stroke-width="6"/>
      ${[50, 95, 140, 185].map(x => `<rect x="${x - 10}" y="100" width="20" height="80" fill="#fff" stroke="#1B1340" stroke-width="5"/>`).join('')}
      <rect x="20" y="180" width="200" height="22" fill="#fff" stroke="#1B1340" stroke-width="6"/></svg>
    <div class="abs" style="left:0;right:0;top:206px;text-align:center;font-weight:800;font-size:26px">kaunter bank</div>
  </div>
  <div class="abs a stamp" style="--d:2.6s;left:60px;top:100px;width:240px;height:240px">
    <svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M18 18 L82 82 M82 18 L18 82" stroke="#F0445A" stroke-width="13" stroke-linecap="round"/></svg></div>
  <div class="abs a pop" style="--d:.3s;left:420px;top:150px;width:250px;height:470px">
    <div class="bob" style="width:100%;height:100%;position:relative">
      <div class="phone" style="inset:0"><div class="notch"></div>
        <div class="scr" style="background:linear-gradient(160deg,#6A5CFF,#3B2BD9);color:#fff">
          <div style="width:110px;height:110px;border-radius:28px;background:#fff;border:5px solid #1B1340;display:flex;align-items:center;justify-content:center;color:#3B2BD9;font-weight:900;font-size:40px">MY</div>
          <div style="margin-top:18px;font-weight:900;font-size:30px">MY alrajhi</div>
          <div style="margin-top:6px;font-weight:700;font-size:22px;opacity:.9">app</div>
        </div></div></div></div>
  <div class="abs a pop" style="--d:1.2s;left:380px;top:650px"><span class="chip g">semua dalam app</span></div>
  <div class="abs a slideL" style="--d:0s;left:40px;top:430px;width:360px;height:520px">${AKU({ arm: 'point' })}</div>
</div>`,
// 2 DAFTAR — app demo placeholder + steps
`<div class="scene bg-mint"><div class="dots"></div>
  <div class="phone a up" style="--d:0s;left:40px;top:150px;width:290px;height:590px">${phonePH('Download &amp; daftar<br>MY alrajhi app', 'Ganti dengan rakaman skrin sebenar: daftar akaun + aktifkan DuitPlus Savings Account-i')}</div>
  <div class="step card a slideR" style="--d:.2s;top:190px"><div class="n">1</div><div class="t">Download<br>MY alrajhi app</div></div>
  <div class="step card a slideR" style="--d:1.1s;top:360px"><div class="n">2</div><div class="t">Daftar akaun</div></div>
  <div class="step card a slideR" style="--d:2.1s;top:510px"><div class="n">3</div><div class="t">Aktifkan DuitPlus Savings Account-i</div></div>
  <div class="abs a pop" style="--d:4.6s;left:385px;top:700px"><span class="chip y">100% digital</span></div>
  <div class="abs a pop" style="--d:5.4s;left:350px;top:800px"><span class="chip">terus dari phone</span></div>
</div>`,
// 3 REFERRAL — code flies to family & friends
`<div class="scene bg-sky"><div class="dots"></div>
  <div class="phone a up" style="--d:0s;left:30px;top:170px;width:250px;height:510px">${phonePH('Ambil referral code', "Settings &amp; Services &gt; 'Refer a friend'")}</div>
  <div class="abs a pop" style="--d:.9s;left:200px;top:300px;width:250px">
    <div class="card" style="padding:18px 16px;text-align:center;transform:rotate(-4deg)">
      <div style="font-weight:800;font-size:22px;color:#5a5680">REFERRAL CODE</div>
      <div style="font-weight:900;font-size:40px;letter-spacing:3px;color:#3B2BD9;white-space:nowrap">KOD-KAU</div></div></div>
  ${[[200, 'Family'], [420, 'Kawan'], [640, 'Sepupu']].map(([y, n], k) => `
    <div class="abs a fly" style="--d:${3.0 + k * .45}s;--tx:${300}px;--ty:${y - 330}px;left:230px;top:320px;width:190px">
      <div class="card" style="padding:10px;text-align:center;font-weight:900;font-size:28px;color:#3B2BD9">KOD-KAU</div></div>
    <div class="abs a pop" style="--d:${2.4 + k * .3}s;left:520px;top:${y}px;width:160px;height:170px">
      <div style="width:150px;height:150px;border-radius:50%;background:#fff;border:5px solid #1B1340;overflow:hidden;position:relative">
        <div style="position:absolute;left:-5px;top:8px;width:160px;height:220px">${k === 1 ? AKU({ hijab: '#FFC93C', shirt: '#F0445A', spk: false }) : KAWAN({ shirt: k ? '#FF7AA8' : '#1FAF7A', skin: k ? '#F3C9A6' : '#D9A27C', hair: k ? '#6B3F22' : '#3A2A22' })}</div></div>
      <div style="position:absolute;left:0;width:150px;top:148px;text-align:center"><span class="chip" style="font-size:22px;padding:6px 14px;box-shadow:0 4px 0 #1B1340">${n}</span></div>
      <div class="abs a pop" style="--d:${4.1 + k * .45}s;right:-4px;top:-6px;width:54px;height:54px">${check('#1FAF7A', (4.2 + k * .45) + 's')}</div>
    </div>`).join('')}
  <div class="abs a pop" style="--d:1.8s;left:40px;top:760px"><span class="chip y">code unik untuk korang</span></div>
</div>`,
// 4 REWARD — must ACTIVATE, both get a treat
`<div class="scene bg-peach"><div class="dots"></div>
  <div class="abs a pop" style="--d:.2s;left:40px;top:80px"><span class="chip" style="font-size:30px">Syarat: akaun mesti <span style="color:#F0445A">DIAKTIFKAN</span></span></div>
  <div class="abs a slideL" style="--d:0s;left:10px;top:470px;width:330px;height:470px">${AKU({ arm: 'phone' })}</div>
  <div class="abs a slideR" style="--d:0s;left:380px;top:470px;width:330px;height:470px">${KAWAN({ arm: 'phone' })}</div>
  <div class="abs a stamp" style="--d:1.7s;left:400px;top:360px;white-space:nowrap">
    <span class="chip g" style="font-size:30px;display:inline-flex;align-items:center;gap:10px">
      <span style="width:40px;height:40px;display:inline-block">${check('#1B1340', '1.9s')}</span>AKTIF</span></div>
  <div class="abs a pop" style="--d:3.6s;left:60px;top:230px;width:230px;height:230px">${sparkles}</div>
  <div class="abs a pop" style="--d:3.5s;left:105px;top:275px;width:140px;height:140px"><div class="bob">${gift('#6A5CFF')}</div></div>
  <div class="abs a pop" style="--d:3.8s;left:440px;top:170px;width:230px;height:230px">${sparkles}</div>
  <div class="abs a pop" style="--d:3.7s;left:485px;top:200px;width:140px;height:140px"><div class="bob2">${gift()}</div></div>
  <div class="abs a up" style="--d:4.1s;left:0;right:0;top:880px;text-align:center"><span class="chip i" style="font-size:36px">Dua-dua dapat manis-manis!</span></div>
  <div class="abs a fade" style="--d:5.6s;right:24px;top:960px;font-weight:800;font-size:22px;background:#fff;padding:4px 12px;border-radius:8px;border:3px solid #1B1340">*T&amp;C applied</div>
</div>`,
// 5 PIDM — safe
`<div class="scene bg-lav"><div class="dots"></div>
  <div class="abs" style="left:210px;top:170px;width:300px;height:300px"><div class="pulse" style="width:100%;height:100%;border-radius:50%;border:10px solid #6A5CFF"></div></div>
  <div class="abs a pop" style="--d:.1s;left:200px;top:140px;width:320px;height:370px">
    <svg viewBox="0 0 160 185" width="100%" height="100%">
      <path d="M80 8 L148 34 L148 90 C148 136 116 166 80 178 C44 166 12 136 12 90 L12 34Z" fill="#3B2BD9" stroke="#1B1340" stroke-width="7" stroke-linejoin="round"/>
      <path d="M80 26 L132 46 L132 90 C132 126 108 150 80 160 C52 150 28 126 28 90 L28 46Z" fill="#6A5CFF"/>
      <path class="a draw" style="--d:.6s" d="M50 94 L72 116 L112 70" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="abs a up" style="--d:1.5s;left:0;right:0;top:560px;text-align:center"><span class="chip y" style="font-size:44px">Dilindungi PIDM</span></div>
  ${['Selamat', 'Mudah', 'Digital'].map((t, k) => `<div class="abs a pop" style="--d:${2.2 + k * .3}s;left:${60 + k * 210}px;top:720px"><span class="chip">${t}</span></div>`).join('')}
</div>`,
// 6 TD-i — goals + rate
`<div class="scene bg-mint"><div class="dots"></div>
  <div class="abs card a slideL" style="--d:.3s;left:50px;top:110px;width:300px;padding:18px 22px;display:flex;align-items:center;gap:16px">
    <span style="width:56px;height:56px;flex:none">${check('#1FAF7A', '.6s')}</span><span style="font-weight:900;font-size:38px">Kahwin</span></div>
  <div class="abs card a slideR" style="--d:1.2s;left:370px;top:110px;width:300px;padding:18px 22px;display:flex;align-items:center;gap:16px">
    <span style="width:56px;height:56px;flex:none">${check('#1FAF7A', '1.5s')}</span><span style="font-weight:900;font-size:38px">Umrah</span></div>
  <div class="abs card a up" style="--d:2.4s;left:50px;top:270px;width:620px;height:640px;background:linear-gradient(165deg,#6A5CFF,#3B2BD9);color:#fff;text-align:center;padding-top:40px">

// ---------- timeline driver ----------
let TL = [], CHUNKS = [];
const KEY = /^(manis-manis|code|aktifkan|aktif|digital|duitplus|referral|pidm|selamat|4\.0%|12|td-i|kahwin|umrah|download|caption|share|family)/i;

function init(timeline) {
  TL = timeline;
  const stage = document.getElementById('stage');
  stage.innerHTML = SCENES.join('');
  const els = [...stage.querySelectorAll('.scene')];
  TL.forEach((s, i) => {
    s.el = els[i];
    // subtitle chunks: ~3 words, timed by character share of the voice clip
    const words = s.sub.split(/\s+/), chunks = [];
    for (let k = 0; k < words.length;) {
      let n = 3; if (words.slice(k, k + n).join(' ').length > 22) n = 2;
      const c = words.slice(k, k + n); k += n;
      chunks.push(c);
    }
    const total = chunks.reduce((a, c) => a + c.join(' ').length + 2, 0);
    let acc = 0;
    chunks.forEach(c => {
      const len = c.join(' ').length + 2;
      CHUNKS.push({ t0: s.voStart + s.voDur * acc / total, t1: s.voStart + s.voDur * (acc + len) / total, words: c });
      acc += len;
    });
  });
  document.getAnimations().forEach(a => a.pause());
}

function rnd(n) { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }

function seek(t) {
  TL.forEach((s, i) => {
    const local = t - s.start + (i === 0 ? 0.7 : 0); // hook: open on a full frame
    const on = t >= s.start && t < s.end + 0.25;
    s.el.style.visibility = on ? 'visible' : 'hidden';
    s.el.style.zIndex = i;
    s.el.style.opacity = i > 0 ? Math.min(1, Math.max(0, local / 0.25)) : 1;
    if (!on) return;
    s.el.getAnimations({ subtree: true }).forEach(a => {
      a.pause();
      a.currentTime = Math.max(0, local) * 1000;
    });
    const talking = t >= s.voStart && t < s.voStart + s.voDur;
    const open = talking && rnd(Math.floor(t * 11)) > 0.35;
    s.el.querySelectorAll('.spk').forEach(p => {
      p.querySelector('.m0').style.display = open ? 'none' : '';
      p.querySelector('.m1').style.display = open ? '' : 'none';
    });
    s.el.querySelectorAll('[data-count]').forEach(e => {
      const p = Math.min(1, Math.max(0, (local - +e.dataset.from) / +e.dataset.dur));
      e.textContent = (+e.dataset.count * (1 - Math.pow(1 - p, 3))).toFixed(1);
    });
  });
  const blink = ((t + 1.6) % 3.2) < 0.13;
  document.querySelectorAll('.eyes').forEach(e => { e.style.transform = blink ? 'scaleY(.1)' : ''; e.style.transformOrigin = '100px 118px'; });
  const c = CHUNKS.find(c => t >= c.t0 && t < c.t1 + 0.12);
  document.getElementById('sub').innerHTML = c
    ? c.words.map(w => KEY.test(w) ? `<b class="w">${w}</b>` : `<span class="w">${w}</span>`).join(' ')
    : '';
}
</script>
