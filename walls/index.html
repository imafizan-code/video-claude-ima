<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"grape","type":"color","label":"Outline (grape)","default":"#4A1352"},
    {"id":"jelly","type":"color","label":"Jelly magenta","default":"#C02784"},
    {"id":"sun","type":"color","label":"Accent (sun)","default":"#FFD23F"},
    {"id":"cream","type":"color","label":"Text (cream)","default":"#FFF7EA"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --grape: #4a1352;
        --jelly: #c02784;
        --sun: #ffd23f;
        --cream: #fff7ea;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #120612;
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 40%;
      }
      #cam video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: var(--cream);
        opacity: 0;
        z-index: 40;
        pointer-events: none;
      }
      .ov {
        position: absolute;
        inset: 0;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22.8"
      data-width="1080"
      data-height="1920"
      data-fps="30"
      data-motion-blur="on"
    >

      <div id="layers" class="ov" data-composition-id="layers" data-composition-src="compositions/layers.html" data-start="6.85" data-duration="1.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="bite" class="ov" data-composition-id="bite" data-composition-src="compositions/bite.html" data-start="8.65" data-duration="1.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="callouts" class="ov" data-composition-id="callouts" data-composition-src="compositions/callouts.html" data-start="12.1" data-duration="2.4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="montage" class="ov" data-composition-id="montage" data-composition-src="compositions/montage.html" data-start="14.5" data-duration="5.7" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" class="ov" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="20.2" data-duration="2.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions" class="ov" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="22.8" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- Voice: cleaned from IMG_0284 (denoise, presence EQ, compression) -->
      <audio id="vo-hook" class="clip" src="assets/audio/vo_0284.wav" data-start="0" data-duration="1.65" data-media-start="13.9" data-volume="1" data-fade-out="0.06" data-track-index="5" data-audio-group="voice"></audio>
      <audio id="vo-wah" class="clip" src="assets/audio/vo_0284.wav" data-start="10.25" data-duration="1.85" data-media-start="8.0" data-volume="1.25" data-fade-in="0.05" data-fade-out="0.08" data-track-index="5" data-audio-group="voice"></audio>

      <!-- SFX: Kenney CC0 foley, rotated takes, ~3–6 dB over the scene sound -->
      <audio id="sx-hook-land" class="clip" src="assets/sfx/thud-soft.wav" data-start="0.13" data-duration="0.569" data-volume="0.45" data-track-index="6" data-audio-group="sfx"></audio>
      <audio id="sx-hook-punch" class="clip" src="assets/sfx/tap-soft-a.wav" data-start="1.1" data-duration="0.132" data-volume="0.35" data-track-index="7" data-audio-group="sfx"></audio>
      <audio id="sx-zoom-out" class="clip" src="assets/sfx/slide-a.wav" data-start="1.38" data-duration="0.601" data-volume="0.5" data-track-index="6" data-audio-group="sfx"></audio>
      <audio id="sx-chip-1" class="clip" src="assets/sfx/pluck-a.wav" data-start="1.93" data-duration="0.1" data-volume="0.4" data-track-index="7" data-audio-group="sfx"></audio>
      <audio id="sx-chip-2" class="clip" src="assets/sfx/pluck-b.wav" data-start="2.08" data-duration="0.162" data-volume="0.4" data-track-index="6" data-audio-group="sfx"></audio>
      <audio id="sx-wrap-1" class="clip" src="assets/sfx/wrapper-a.wav" data-start="2.88" data-duration="0.937" data-volume="0.7" data-track-index="7" data-audio-group="sfx"></audio>
      <audio id="sx-wrap-2" class="clip" src="assets/sfx/wrapper-b.wav" data-start="3.62" data-duration="0.732" data-volume="0.7" data-track-index="6" data-audio-group="sfx"></audio>
      <audio id="sx-wrap-3" class="clip" src="assets/sfx/cloth.wav" data-start="4.35" data-duration="0.415" data-volume="0.55" data-track-index="7" data-audio-group="sfx"></audio>
      <audio id="sx-wrap-4" class="clip" src="assets/sfx/wrapper-a.wav" data-start="4.7" data-duration="0.937" data-volume="0.5" data-track-index="6" data-audio-group="sfx"></audio>
      <audio id="sx-reveal-rise" class="clip" src="assets/sfx/rise-tick.wav" data-start="5.27" data-duration="0.258" data-volume="0.3" data-track-index="7" data-audio-group="sfx"></audio>
      <audio id="sx-reveal-ting" class="clip" src="assets/sfx/glass-ting-a.wav" data-start="5.42" data-duration="0.207" data-volume="0.4" data-track-index="8" data-audio-group="sfx"></audio>
      <audio id="sx-reveal-ting2" class="clip" src="assets/sfx/glass-ting-b.wav" data-start="5.62" data-duration="0.207" data-volume="0.3" data-track-index="7" data-audio-group="sfx"></audio>
      <audio id="sx-layers-land" class="clip" src="assets/sfx/thud-soft.wav" data-start="6.93" data-duration="0.569" data-volume="0.4" data-track-index="6" data-audio-group="sfx"></audio>
      <audio id="sx-layer-1" class="clip" src="assets/sfx/pluck-a.wav" data-start="7.17" data-duration="0.1" data-volume="0.35" data-track-index="7" data-audio-group="sfx"></audio>
      <audio id="sx-layer-2" class="clip" src="assets/sfx/select.wav" data-start="7.3" data-duration="0.04" data-volume="0.3" data-track-index="8" data-audio-group="sfx"></audio>
      <audio id="sx-layer-3" class="clip" src="assets/sfx/pluck-b.wav" data-start="7.43" data-duration="0.162" data-volume="0.35" data-track-index="7" data-audio-group="sfx"></audio>
      <audio id="sx-layer-4" class="clip" src="assets/sfx/select.wav" data-start="7.56" data-duration="0.04" data-volume="0.3" data-track-index="6" data-audio-group="sfx"></audio>

      <audio id="sx-mont-2" class="clip" src="assets/sfx/tap-soft-b.wav" data-start="15.43" data-duration="0.144" data-volume="0.32" data-track-index="6" data-audio-group="sfx"></audio>
      <audio id="sx-mont-3" class="clip" src="assets/sfx/tap-soft-a.wav" data-start="16.33" data-duration="0.132" data-volume="0.32" data-track-index="7" data-audio-group="sfx"></audio>

      <audio id="sx-cta-2" class="clip" src="assets/sfx/pluck-b.wav" data-start="20.68" data-duration="0.162" data-volume="0.38" data-track-index="6" data-audio-group="sfx"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = "#cam";
      // Each shot starts from a clean frame
      [0, 1.65, 2.85, 5.25, 6.85, 8.65, 10.25, 12.1, 14.5, 15.4, 16.3, 17.2, 18.6, 20.2].forEach((t) =>
        tl.set(cam, { scale: 1, x: 0, y: 0 }, t),
      );
      // Hook: punch on "sedap", then zoom through into the pack
      tl.to(cam, { scale: 1.1, duration: 0.12, ease: "expo.out" }, 1.09);
      tl.to(cam, { scale: 1.32, duration: 0.24, ease: "power3.in" }, 1.41);
      tl.fromTo(cam, { scale: 1.3 }, { scale: 1, duration: 0.45, ease: "expo.out" }, 1.65);
      // Unwrap: fast-forward plays flat, the reveal leans in
      tl.fromTo(cam, { scale: 1 }, { scale: 1.07, duration: 1.6, ease: "power2.inOut" }, 5.25);
      // Layers close-up: settle from slightly large
      tl.fromTo(cam, { scale: 1.08 }, { scale: 1, duration: 0.6, ease: "expo.out" }, 6.85);
      // "wah, sedap ni" punch
      tl.to(cam, { scale: 1.12, duration: 0.12, ease: "expo.out" }, 11.13);
      // Montage bumps on each cut
      [14.5, 15.4, 16.3].forEach((t) => tl.fromTo(cam, { scale: 1.06 }, { scale: 1, duration: 0.35, ease: "expo.out" }, t));
      tl.fromTo(cam, { scale: 1.1 }, { scale: 1.02, duration: 0.5, ease: "expo.out" }, 17.2);
      // Dip to cream into the CTA
      tl.to("#flash", { opacity: 0.85, duration: 0.1, ease: "power2.in" }, 20.1);
      tl.to("#flash", { opacity: 0, duration: 0.28, ease: "power2.out" }, 20.2);
      window.__timelines["main"] = tl;
    </script>

</html>
