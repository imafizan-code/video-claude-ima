<title>Piza Ceria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: arcade cabinet — HUD bar, ticket rail, stage canvas, station controls, station tabs. One committed look: basil-green tablecloth + tomato + mozzarella paper. */
:root{
  --basil:#163428; --basil-2:#1d4234; --basil-3:#285844; --basil-4:#3b7a5f;
  --tomato:#e5432d; --tomato-d:#a92b19; --tomato-l:#ff6b52;
  --mozz:#fff6dc; --paper:#fbf0cf; --paper-2:#f1e0b0; --ink:#3a2618; --ink-soft:#7a5a3c;
  --gold:#f5b82e; --gold-d:#c88a0c; --good:#2f9e5b; --bad:#d23b2a;
  --text:#fff6dc; --muted:#a9c4b5;
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background-color:var(--basil);
  background-image:repeating-conic-gradient(var(--basil) 0 25%, var(--basil-2) 0 50%);
  background-size:56px 56px;
  color:var(--text); font-family:var(--font-body); font-weight:700;
  -webkit-tap-highlight-color:transparent;
}
.game{max-width:1040px;margin:0 auto;padding-block:12px 20px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.ticket:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo-mark{width:40px;height:40px;flex:none}
.logo h1{font-family:var(--font-display);font-weight:400;font-size:1.75rem;line-height:1;margin:0;letter-spacing:.5px;color:var(--mozz);text-shadow:0 3px 0 var(--tomato-d)}
.logo small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--basil-3);border:2px solid var(--basil-4);border-radius:12px;padding:5px 12px;display:flex;flex-direction:column;min-width:76px}
.chip span{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip b{font-family:var(--font-display);font-weight:400;font-size:1.2rem;font-variant-numeric:tabular-nums;color:var(--mozz)}
.chip.money b{color:var(--gold)}
.icon-btn{width:46px;height:46px;border-radius:12px;border:2px solid var(--basil-4);background:var(--basil-3);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}

/* Ticket rail */
.rail-wrap{position:relative;background:linear-gradient(#5b3a22,#4a2f1b);border-radius:14px;padding:14px 10px 10px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.rail-wrap::before{content:"";position:absolute;left:12px;right:12px;top:7px;height:5px;border-radius:3px;background:linear-gradient(#d9dde1,#8b9299)}
.rail{display:flex;gap:10px;overflow-x:auto;min-height:118px;align-items:flex-start;padding:2px 2px 6px;scrollbar-width:thin}
.rail-empty{color:#e9cfa8;font-weight:800;padding:34px 10px;font-size:.95rem}
.ticket{flex:none;width:156px;background:var(--paper);color:var(--ink);border-radius:3px 3px 8px 8px;padding:8px 9px 8px;position:relative;
  transform:rotate(var(--tilt,0deg));transition:transform .18s ease, box-shadow .18s ease;box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;border:none;text-align:left;animation:drop .4s cubic-bezier(.3,1.5,.5,1)}
.ticket::before{content:"";position:absolute;top:-9px;left:50%;width:22px;height:12px;margin-left:-11px;border-radius:3px;background:linear-gradient(#e6e9ec,#9aa1a8)}
.ticket:hover{transform:rotate(0) translateY(-2px)}
.ticket.active{box-shadow:0 0 0 3px var(--gold),0 6px 0 rgba(0,0,0,.25);transform:rotate(0) translateY(-2px)}
@keyframes drop{from{transform:translateY(-30px) rotate(-6deg);opacity:0}}
.t-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--paper-2);padding-bottom:4px;margin-bottom:5px}
.t-num{font-family:var(--font-display);font-size:1.15rem;color:var(--tomato-d)}
.t-name{font-size:.74rem;color:var(--ink-soft);font-weight:800;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.t-reqs li{display:flex;align-items:center;gap:5px;font-size:.78rem;font-weight:800}
.t-reqs img{width:22px;height:22px}
.t-reqs .cnt{font-variant-numeric:tabular-nums;min-width:22px}
.t-reqs .reg{display:flex;align-items:center;gap:3px;color:var(--ink-soft);font-size:.72rem}
.t-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:.7rem;color:var(--ink-soft);gap:4px}
.t-meta b{color:var(--ink)}
.t-status{display:inline-block;margin-top:6px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:2px 7px;border-radius:20px}
.t-status.s-oven{background:var(--tomato-d)} .t-status.s-board{background:var(--good)} .t-status.s-prep{background:var(--gold-d)}
.t-pat{height:5px;border-radius:3px;background:var(--paper-2);margin-top:6px;overflow:hidden}
.t-pat i{display:block;height:100%;width:100%;background:var(--good);transition:width .4s linear, background .4s}

/* Stage */
.stage{position:relative;margin-inline:auto;width:min(100%, max(520px, calc((100dvh - 360px) * 1.607)));max-width:100%;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px var(--basil-4),0 14px 30px rgba(0,0,0,.35)}
.stage canvas{display:block;width:100%;aspect-ratio:900/560;max-width:100%;touch-action:none;background:#2a2a2a}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--mozz);padding:8px 16px;border-radius:30px;font-weight:900;font-size:.95rem;transition:all .25s ease;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--good)} .toast.bad{background:var(--bad)}

/* Controls */
.controls{min-height:86px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--basil-2);border:2px solid var(--basil-3);border-radius:16px;padding:10px}
.hint{color:var(--muted);font-size:.9rem;max-width:44ch;text-align:center}
.hint b{color:var(--mozz)}
.btn{font-family:var(--font-display);font-weight:400;font-size:1.1rem;letter-spacing:.3px;border:none;border-radius:14px;padding:12px 18px;background:var(--tomato);color:#fff;box-shadow:inset 0 -5px 0 var(--tomato-d),0 3px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--tomato-d)}
.btn.alt{background:var(--mozz);color:var(--ink);box-shadow:inset 0 -5px 0 var(--paper-2),0 3px 0 rgba(0,0,0,.25)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:inset 0 -5px 0 var(--gold-d),0 3px 0 rgba(0,0,0,.25)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 2px var(--basil-4)}
.btn.done{background:var(--good);box-shadow:inset 0 -5px 0 #1f6b3d}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.bins{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bin{width:62px;border:none;border-radius:12px;background:var(--paper);color:var(--ink);padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 -4px 0 var(--paper-2);transition:transform .12s}
.bin img{width:40px;height:40px}
.bin span{font-size:.6rem;font-weight:900;line-height:1.1;text-align:center}
.bin.sel{background:var(--gold);box-shadow:inset 0 -4px 0 var(--gold-d),0 0 0 3px var(--mozz);transform:translateY(-3px)}
.sep{width:2px;align-self:stretch;background:var(--basil-3);border-radius:2px}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{position:relative;border:none;border-radius:14px;background:var(--basil-3);color:var(--muted);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font-display);font-size:1rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.tab svg{width:26px;height:26px}
.tab.on{background:var(--mozz);color:var(--ink)}
.tab .badge{position:absolute;top:6px;right:10px;width:14px;height:14px;border-radius:50%;background:var(--tomato);border:2px solid var(--mozz);display:none;animation:pulse 1s infinite}
.tab.alert .badge{display:block}
@keyframes pulse{50%{transform:scale(1.3)}}
.tab kbd{position:absolute;top:6px;left:9px;font:800 .62rem var(--font-body);opacity:.55}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(10,24,18,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-bottom,0px));overflow-y:auto}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:22px 22px 20px;width:min(520px,100%);box-shadow:0 10px 0 var(--paper-2),0 24px 50px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{font-family:var(--font-display);font-weight:400;font-size:2rem;margin:0 0 4px;color:var(--tomato-d);text-wrap:balance;line-height:1.05}
.card p{margin:0 0 10px;color:var(--ink-soft);line-height:1.45}
.card canvas{display:block;margin:0 auto 10px;max-width:100%}
.steps{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:.92rem;line-height:1.35}
.steps li i{font-style:normal;font-family:var(--font-display);background:var(--tomato);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.steps li b{color:var(--ink)}
.card .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bars{display:grid;gap:8px;margin:6px 0 14px}
.bar{display:grid;grid-template-columns:72px 1fr 40px;align-items:center;gap:10px;font-size:.88rem}
.bar .track{height:14px;border-radius:8px;background:var(--paper-2);overflow:hidden}
.bar .fill{height:100%;border-radius:8px;width:0;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--mozz);border-radius:14px;padding:10px 14px;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.total .stars{font-size:1.5rem;color:var(--gold);letter-spacing:2px}
.total .tip{font-family:var(--font-display);font-size:1.4rem;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 16px}
.stat{background:#fff9e8;border-radius:12px;padding:8px 12px}
.stat span{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.stat b{font-family:var(--font-display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.rank{text-align:center;font-family:var(--font-display);font-size:1.15rem;background:var(--gold);border-radius:12px;padding:8px;margin-bottom:14px}

@media (max-width:560px){
  .logo h1{font-size:1.35rem} .chip{min-width:62px;padding:4px 8px} .chip b{font-size:1rem}
  .tab{font-size:.82rem;padding:8px 4px} .tab kbd{display:none}
  .bin{width:54px} .bin img{width:34px;height:34px}
  .btn{font-size:1rem;padding:10px 14px}
  .ticket{width:140px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="game">
  <header class="hud">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#e3a356"/><circle cx="20" cy="20" r="14.5" fill="#d8402a"/><circle cx="20" cy="20" r="12.5" fill="#ffe7a6"/><circle cx="15" cy="15" r="3" fill="#c0392b"/><circle cx="25" cy="17" r="3" fill="#c0392b"/><circle cx="18" cy="25" r="3" fill="#c0392b"/><circle cx="26" cy="26" r="1.6" fill="#2b2a2a"/></svg>
      <div><h1>Piza Ceria</h1><small>Kedai piza anda sendiri</small></div>
    </div>
    <div class="chips">
      <div class="chip"><span>Hari</span><b id="hDay">1</b></div>
      <div class="chip"><span>Dilayan</span><b id="hServed">0/0</b></div>
      <div class="chip money"><span>Tip</span><b id="hTips">RM0.00</b></div>
    </div>
    <button class="icon-btn" id="muteBtn" aria-label="Bunyi"></button>
  </header>

  <section class="rail-wrap" aria-label="Tiket pesanan"><div class="rail" id="rail"></div></section>

  <div class="stage">
    <canvas id="cv" width="900" height="560"></canvas>
    <div class="toast" id="toast"></div>
  </div>

  <div class="controls" id="controls"></div>

  <nav class="tabs" id="tabs">
    <button class="tab" data-st="counter"><kbd>1</kbd><span class="badge"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17h16"/><path d="M6 17a6 6 0 0 1 12 0"/><path d="M12 8V6"/><path d="M10 6h4"/><path d="M3 20h18"/></svg>Kaunter</button>
    <button class="tab" data-st="topping"><kbd>2</kbd><span class="badge"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6c5-3 13-3 18 0L12 22z"/><circle cx="10" cy="10" r="1.3" fill="currentColor"/><circle cx="14" cy="13" r="1.3" fill="currentColor"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>Topping</button>
    <button class="tab" data-st="oven"><kbd>3</kbd><span class="badge"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"/></svg>Oven</button>
    <button class="tab" data-st="cut"><kbd>4</kbd><span class="badge"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="15" r="5"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/><path d="M12.5 11.5 20 4"/></svg>Potong</button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>

<script>
(() => {
"use strict";
const W = 900, H = 560, TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const sh = (c, f, a = 1) => rgb(c.map(v => clamp(v * f, 0, 255)), a);
function stops(arr, k) {
  k = clamp(k, arr[0][0], arr[arr.length - 1][0]);
  for (let i = 0; i < arr.length - 1; i++) if (k <= arr[i + 1][0]) return mix(arr[i][1], arr[i + 1][1], (k - arr[i][0]) / (arr[i + 1][0] - arr[i][0]));
  return arr[arr.length - 1][1];
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(ctx, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circ(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }

/* ---------- Data ---------- */
const TOPS = {
  pep:    { name: "Pepperoni", day: 1 },
  mush:   { name: "Cendawan", day: 1 },
  pepper: { name: "Lada Benggala", day: 1 },
  onion:  { name: "Bawang", day: 2 },
  olive:  { name: "Zaitun", day: 2 },
  pine:   { name: "Nanas", day: 3 },
  sausage:{ name: "Sosej", day: 3 },
};
const REGION = { whole: "Penuh", left: "Kiri", right: "Kanan" };
const BAKE = [{ name: "Lembut", t: 14 }, { name: "Sederhana", t: 22 }, { name: "Garing", t: 30 }];
const GAUGE_MAX = 40, ZONE = 3;
const NAMES = ["Aisyah","Hafiz","Mei Ling","Ravi","Siti","Farid","Kumar","Zara","Daniel","Nurul","Amir","Lina","Wei Jie","Priya","Iman","Adam","Sofea","Arjun","Hana","Jun","Faiz","Mira"];
const SKINS = [[255,221,186],[243,198,156],[226,174,128],[200,138,96],[156,102,68],[112,72,48]];
const SHIRTS = ["#3d7dd8","#e07a2f","#8e5cc7","#2fa37a","#d64561","#f0b429","#4a5568","#1fa2b8","#c2410c"];
const HAIRS = ["#2b1d14","#4a2f1d","#7a4b2a","#1a1a1a","#a8581d","#d9a441"];
const HIJABS = ["#e88aa6","#6fa8dc","#9b7fd4","#f2c14e","#5bb08a","#e5e5e5","#d9734e"];
const SAVE_KEY = "piza-ceria-v1";

const CRUST = [[0,[240,214,160]],[0.6,[236,194,124]],[1,[219,152,74]],[1.36,[178,102,46]],[1.7,[96,54,26]],[2.1,[38,26,18]]];
const CHEESE = [[0,[255,247,214]],[0.6,[255,238,172]],[1,[253,216,122]],[1.36,[234,172,82]],[1.7,[142,92,42]],[2.1,[58,38,24]]];

/* ---------- State ---------- */
const S = {
  day: 1, totalTips: 0, dayTips: 0, station: "counter", customers: [], tickets: [], prep: null,
  oven: [null, null, null, null], board: null, sel: null, time: 0, arrivals: [], dayCount: 0, served: 0,
  results: [], paused: true, muted: false, nextTicket: 1, nextId: 1, ptr: { x: -99, y: -99, down: false }, cut: null, lastPlace: null,
};
try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if (d) { S.day = d.day || 1; S.totalTips = d.totalTips || 0; S.muted = !!d.muted; } } catch (e) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ day: S.day, totalTips: S.totalTips, muted: S.muted })); } catch (e) {} }

/* ---------- Audio ---------- */
let AC = null;
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(f, d = 0.12, type = "sine", vol = 0.15, delay = 0, slide = 0) {
  if (S.muted) return; const a = actx(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
const SFX = {
  pop: () => tone(480 + Math.random() * 160, 0.08, "triangle", 0.12, 0, -220),
  bell: () => { tone(1320, 0.6, "sine", 0.1); tone(1760, 0.7, "sine", 0.07, 0.1); },
  ding: () => { tone(988, 0.3, "triangle", 0.14); tone(1319, 0.45, "triangle", 0.12, 0.13); },
  cut: () => tone(160, 0.18, "sawtooth", 0.05, 0, 700),

function selectTicket(tk) {

  line.forEach((c, i) => { if (i === 0) Object.assign(c, { tx: 470, ty: 512, ts: 1.12 }); else Object.assign(c, { tx: i <= 3 ? 600 + i * 72 : 960, ty: 458, ts: 0.78 }); });

      const ux = dx / L, uy = dy / L, nx = -uy, ny = ux, d = ((a.x - CUT_C.x) * nx + (a.y - CUT_C.y) * ny) / CUT_C.r;
      if (Math.abs(d) < 0.95) { if (S.board.cuts.length < 10) { S.board.cuts.push({ a: Math.atan2(uy, ux), d }); SFX.cut(); } }
      else toast("Garisan tidak kena piza");
    }
  }
  S.cut = null;
};
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("pointerleave", () => { if (!S.ptr.down) { S.ptr.x = -99; } });

/* ---------- Overlays ---------- */
const ov = $("#overlay");
function closeOverlay() { ov.hidden = true; ov.innerHTML = ""; }
function stars(avg) { const n = avg >= 90 ? 3 : avg >= 70 ? 2 : avg >= 45 ? 1 : 0; return "★".repeat(n) + "☆".repeat(3 - n); }
function showResult(c, pz, tk, sc, avg, tip) {
  S.paused = true; ov.hidden = false;
  const react = avg >= 90 ? "Sedap gila! Terbaik!" : avg >= 70 ? "Sedap, terima kasih!" : avg >= 45 ? "Boleh la..." : "Hmm, kecewa sikit.";
  const row = (l, v) => `<div class="bar"><span>${l}</span><div class="track"><div class="fill" data-w="${v}" style="background:${v >= 68 ? "var(--good)" : v >= 42 ? "var(--gold)" : "var(--bad)"}"></div></div><b>${v}</b></div>`;
  ov.innerHTML = `<div class="card" role="dialog" aria-label="Keputusan">
    <canvas id="resCv" width="720" height="380" style="width:100%;max-width:360px;aspect-ratio:360/190"></canvas>
    <h2>${c.name}: “${react}”</h2>
    <p>Tiket #${tk.num} · ${tk.order.reqs.map(q => `${q.n} ${TOPS[q.t].name.toLowerCase()} (${REGION[q.region].toLowerCase()})`).join(", ")} · ${BAKE[tk.order.bake].name.toLowerCase()} · ${tk.order.slices} keping</p>
    <div class="bars">${row("Tunggu", sc.wait)}${row("Topping", sc.top)}${row("Bakar", sc.bake)}${row("Potong", sc.cut)}</div>
    <div class="total"><span>Purata <b style="font-size:1.3rem">${avg}</b></span><span class="stars">${stars(avg)}</span><span class="tip">+RM${tip.toFixed(2)}</span></div>
    <div class="actions"><button class="btn gold" id="resNext">${S.served >= S.dayCount ? "Tamat Hari" : "Teruskan"}</button></div></div>`;
  const rc = $("#resCv").getContext("2d"), mood = moodOf(avg); let alive = true;
  const draw = ts => {
    if (!alive) return; const t = ts / 1000; rc.setTransform(2, 0, 0, 2, 0, 0); rc.clearRect(0, 0, 360, 190);
    rc.fillStyle = "#f1e0b0"; rr(rc, 0, 0, 360, 190, 16); rc.fill();
    drawCustomer(rc, 95, 268, 0.82, c.look, mood, t);
    drawPizza(rc, 258, 95, 76, pz);
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  setTimeout(() => ov.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"), 60);
  if (avg >= 45) SFX.coin(); else SFX.bad();
  $("#resNext").onclick = () => { alive = false; closeOverlay(); SFX.click(); if (S.served >= S.dayCount) endDay(); else S.paused = false; };
  $("#resNext").focus();
}
function endDay() {
  S.paused = true; ov.hidden = false;
  const avg = Math.round(S.results.reduce((s, r) => s + r.avg, 0) / Math.max(1, S.results.length));
  const rank = avg >= 90 ? "Chef Legenda" : avg >= 78 ? "Tukang Piza Hebat" : avg >= 60 ? "Pembantu Dapur Cekap" : "Pelatih Doh";
  const done = S.day; S.day++; save(); SFX.fanfare();
  const unlockNext = Object.keys(TOPS).filter(t => TOPS[t].day === S.day);
  ov.innerHTML = `<div class="card" role="dialog" aria-label="Tamat hari">
    <h2>Hari ${done} selesai!</h2><p>Kedai ditutup. Ini rekod hari ini.</p>
    <div class="stats">
      <div class="stat"><span>Pelanggan</span><b>${S.results.length}</b></div>
      <div class="stat"><span>Purata skor</span><b>${avg} ${stars(avg).replace(/☆/g, "")}</b></div>
      <div class="stat"><span>Tip hari ini</span><b>RM${S.dayTips.toFixed(2)}</b></div>
      <div class="stat"><span>Jumlah tip</span><b>RM${S.totalTips.toFixed(2)}</b></div>
    </div>
    <div class="rank">Gelaran: ${rank}</div>
    ${unlockNext.length ? `<p><b>Topping baru esok:</b> ${unlockNext.map(t => TOPS[t].name).join(", ")}.</p>` : ""}
    ${S.day === 2 ? `<p>Mulai esok, pelanggan akan minta topping pada <b>separuh</b> piza sahaja.</p>` : ""}
    <div class="actions"><button class="btn ghost" id="resetBtn" style="color:var(--ink-soft);box-shadow:inset 0 0 0 2px var(--paper-2)">Mula dari Hari 1</button><button class="btn gold" id="nextDay">Buka Hari ${S.day}</button></div></div>`;
  $("#nextDay").onclick = () => { closeOverlay(); SFX.bell(); startDay(); };
  $("#resetBtn").onclick = () => { S.day = 1; S.totalTips = 0; save(); closeOverlay(); startDay(); };
}
function showStart() {
  S.paused = true; ov.hidden = false;
  ov.innerHTML = `<div class="card" role="dialog" aria-label="Mula">
    <canvas id="startCv" width="440" height="300" style="width:220px;aspect-ratio:220/150"></canvas>
    <h2>Selamat datang ke Piza Ceria</h2>
    <p>Anda tukang piza baharu. Layan setiap pelanggan dengan pantas dan tepat untuk kutip tip.</p>
    <ol class="steps">
      <li><i>1</i><span><b>Kaunter</b> — ambil pesanan. Tiket muncul di rel atas.</span></li>
      <li><i>2</i><span><b>Topping</b> — sapu sos, tabur keju, letak topping ikut bilangan dan bahagian (kiri, kanan atau penuh).</span></li>
      <li><i>3</i><span><b>Oven</b> — piza terus masak walaupun anda di stesen lain. Keluarkan bila jarum dalam zon.</span></li>
      <li><i>4</i><span><b>Potong</b> — seret garisan melalui tengah ikut bilangan keping, kemudian hidang.</span></li>
    </ol>
    <div class="actions">${S.day > 1 ? `<button class="btn ghost" id="restart" style="color:var(--ink-soft);box-shadow:inset 0 0 0 2px var(--paper-2)">Mula semula</button>` : ""}<button class="btn gold" id="startBtn">Buka Kedai — Hari ${S.day}</button></div></div>`;
  const sc = $("#startCv").getContext("2d"), demo = newPizza(0); demo.sauce = demo.cheese = 1; demo.sauceOn = demo.cheeseOn = true; demo.bake = 22; demo.seed = 42;
  const R = rng(5); for (let i = 0; i < 7; i++) { const a = i / 7 * TAU, d = 0.5; demo.pieces.push({ t: "pep", x: Math.cos(a) * d, y: Math.sin(a) * d, rot: R() * 6, s: 1 }); }
  [[0, 0, "mush"], [0.22, -0.18, "pepper"], [-0.2, 0.2, "olive"], [-0.2, -0.2, "pepper"], [0.2, 0.22, "mush"]].forEach(([x, y, t]) => demo.pieces.push({ t, x, y, rot: R() * 6, s: 1 }));
  for (let i = 0; i < 4; i++) demo.cuts.push({ a: i * Math.PI / 4, d: 0 });
  let alive = true;
  const draw = ts => { if (!alive) return; sc.setTransform(2, 0, 0, 2, 0, 0); sc.clearRect(0, 0, 220, 150); NOW = ts / 1000; sc.save(); sc.translate(110, 75); sc.rotate(ts / 4000); drawPizza(sc, 0, 0, 66, demo); sc.restore(); requestAnimationFrame(draw); };
  requestAnimationFrame(draw);
  $("#startBtn").onclick = () => { alive = false; actx(); SFX.bell(); closeOverlay(); startDay(); };
  const rs = $("#restart"); if (rs) rs.onclick = () => { alive = false; S.day = 1; S.totalTips = 0; save(); actx(); closeOverlay(); startDay(); };
  $("#startBtn").focus();
}

/* ---------- Boot ---------- */
makeIcons(); muteIcon(); resize(); renderRail(); renderControls(); setStation("counter"); hud();
S.dayCount = Math.min(3 + S.day, 9); hud();
showStart();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
})();
