<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snek Comel</title>
<style>
  :root{--bg:#fde8f0;--ink:#5b3a63;--card:#fff;--accent:#ff7eb6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle at 20% 10%,#ffd6e8,transparent 50%),radial-gradient(circle at 80% 90%,#d6e8ff,transparent 50%),var(--bg);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none;touch-action:none}
  h1{margin:0;font-size:28px;letter-spacing:1px}
  .bar{display:flex;gap:10px}
  .pill{background:var(--card);border-radius:999px;padding:6px 18px;font-weight:700;box-shadow:0 4px 0 #f3c6dc}
  .wrap{position:relative;border-radius:24px;padding:8px;background:var(--card);box-shadow:0 10px 0 #f3c6dc,0 20px 40px #c98ab033}
  canvas{display:block;border-radius:18px;width:min(92vw,440px);height:min(92vw,440px)}
  .overlay{position:absolute;inset:8px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:#fff8;backdrop-filter:blur(4px);text-align:center;transition:opacity .2s}
  .overlay.hide{opacity:0;pointer-events:none}
  .overlay h2{margin:0;font-size:30px}
  .overlay p{margin:0;opacity:.8}
  button{font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:10px 28px;cursor:pointer;box-shadow:0 5px 0 #d4558f}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #d4558f}
  small{opacity:.6}
  .pad{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,68px);gap:8px}
  .pad button{width:68px;height:68px;padding:0;font-size:28px;background:#fff;color:var(--accent);box-shadow:0 5px 0 #f3c6dc;border-radius:22px}
  .pad button:active,.pad button.on{transform:translateY(3px);box-shadow:0 2px 0 #f3c6dc;background:#ffeaf4}
  .pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
  #mute{position:absolute;top:18px;right:18px;width:40px;height:40px;padding:0;font-size:18px;background:#fff;box-shadow:0 3px 0 #f3c6dc;z-index:2}
</style>
</head>
<body>
  <h1>🐍 Snek Comel</h1>
  <div class="bar"><div class="pill">🍎 <span id="score">0</span></div><div class="pill">👑 <span id="best">0</span></div></div>
  <div class="wrap">
    <button id="mute" title="Bunyi">🔊</button>
    <canvas id="c" width="800" height="800"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovT">Jom main!</h2>
      <p id="ovP">Makan epal, jangan langgar dinding</p>
      <button id="go">Mula</button>
      <small>Anak panah / WASD / swipe · Space = jeda</small>
    </div>
  </div>
<div class="pad">
    <button class="u" data-d="0,-1">▲</button><button class="l" data-d="-1,0">◀</button>
    <button class="d" data-d="0,1">▼</button><button class="r" data-d="1,0">▶</button>
  </div>
<script>
// ---- bunyi comel (WebAudio, tiada fail luar) ----
let AC,muted=false;try{muted=localStorage.getItem('snekMute')==='1'}catch(e){}
function tone(f,d,o={}){
  if(muted)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),g=AC.createGain();
    os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
    if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.v||.18,t+.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    os.connect(g).connect(AC.destination);os.start(t);os.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  start(){[523,659,784,1047].forEach((f,i)=>tone(f,.14,{at:i*.07,type:'triangle'}))},
  eat(){tone(660,.09,{to:990,type:'sine',v:.22});tone(990,.14,{at:.08,to:1320,type:'sine',v:.2})},
  turn(){tone(440+Math.random()*60,.04,{type:'triangle',v:.05})},
  pause(){tone(500,.1,{to:350,type:'sine'})},
  die(){tone(420,.45,{to:110,type:'sawtooth',v:.1});tone(300,.5,{at:.12,to:70,type:'triangle',v:.12})}
};
const muteBtn=document.getElementById('mute');
function showMute(){muteBtn.textContent=muted?'🔇':'🔊'}showMute();
muteBtn.onclick=()=>{muted=!muted;showMute();try{localStorage.setItem('snekMute',muted?'1':'0')}catch(e){};if(!muted)sfx.eat();muteBtn.blur()};
const N=20, S=800/N, cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let best=0; try{best=+localStorage.getItem('snekBest')||0}catch(e){}
$('best').textContent=best;

let snake,prev,dir,nextDir,food,score,alive,running,paused,stepMs,acc,last,parts=[],shake=0,t0=0,queue=[];

function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}]; prev=snake.map(p=>({...p}));
  dir={x:1,y:0}; queue=[]; score=0; alive=true; paused=false; stepMs=140; acc=0; parts=[];
  $('score').textContent=0; placeFood();
}
function placeFood(){
  do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function start(){sfx.start();reset();running=true;$('ov').classList.add('hide');last=performance.now()}
function turn(x,y){
  const ref=queue.length?queue[queue.length-1]:dir;
  if(ref.x===-x&&ref.y===-y||ref.x===x&&ref.y===y)return;
  if(queue.length<3){queue.push({x,y});sfx.turn()}
}
function burst(x,y,col){
  for(let i=0;i<14;i++){const a=Math.random()*6.28,v=2+Math.random()*4;
    parts.push({x:(x+.5)*S,y:(y+.5)*S,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,c:col,r:6+Math.random()*8})}
}
function step(){
  if(queue.length)dir=queue.shift();
  prev=snake.map(p=>({...p}));
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.slice(0,-1).some(s=>s.x===h.x&&s.y===h.y)){return die()}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    sfx.eat();score++; $('score').textContent=score; burst(food.x,food.y,['#ff5c8a','#ffd166','#ff9ec7'][score%3]);
    stepMs=Math.max(70,stepMs-2); placeFood();
  } else snake.pop();
}
function die(){
  alive=false; running=false; shake=14; sfx.die();
  if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('snekBest',best)}catch(e){}}
  setTimeout(()=>{$('ovT').textContent=score>=best&&score>0?'Rekod baru! 🎉':'Alamak 😵';
    $('ovP').textContent='Skor: '+score; $('go').textContent='Main lagi'; $('ov').classList.remove('hide')},500);
}

function lerp(a,b,t){return a+(b-a)*t}
function drawBoard(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    ctx.fillStyle=(x+y)%2?'#e9f9e1':'#f4ffec'; ctx.fillRect(x*S,y*S,S,S);
  }
}
function drawFood(time){
  const bob=Math.sin(time/250)*3, cx=(food.x+.5)*S, cy=(food.y+.5)*S+bob, r=S*.36;
  ctx.fillStyle='#0002';ctx.beginPath();ctx.ellipse(cx,(food.y+.5)*S+S*.36,r*.8,r*.25,0,0,7);ctx.fill();
  ctx.fillStyle='#ff4f7b';ctx.beginPath();ctx.arc(cx-r*.3,cy,r*.75,0,7);ctx.arc(cx+r*.3,cy,r*.75,0,7);ctx.fill();
  ctx.fillStyle='#fff9';ctx.beginPath();ctx.ellipse(cx-r*.5,cy-r*.3,r*.18,r*.3,.5,0,7);ctx.fill();
  ctx.fillStyle='#5fcf80';ctx.beginPath();ctx.ellipse(cx+r*.35,cy-r*.85,r*.4,r*.2,-.6,0,7);ctx.fill();
  ctx.strokeStyle='#7a4b2a';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy-r*.5);ctx.lineTo(cx,cy-r*.95);ctx.stroke();
}
function drawSnake(t,time){
  const pts=snake.map((p,i)=>{const q=prev[Math.min(i,prev.length-1)];return{x:lerp(q.x,p.x,t),y:lerp(q.y,p.y,t)}})
    .map(p=>({x:(p.x+.5)*S,y:(p.y+.5)*S}));
  const path=()=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y))};
  ctx.lineCap='round';ctx.lineJoin='round';
  // shadow, outline, body, belly stripe
  ctx.save();ctx.translate(0,6);ctx.strokeStyle='#0002';ctx.lineWidth=S*.8;path();ctx.stroke();ctx.restore();
  ctx.strokeStyle='#e0558f';ctx.lineWidth=S*.82;path();ctx.stroke();
  ctx.strokeStyle='#ff8cc0';ctx.lineWidth=S*.68;path();ctx.stroke();
  ctx.strokeStyle='#ffc2dd';ctx.lineWidth=S*.28;ctx.globalAlpha=.7;path();ctx.stroke();ctx.globalAlpha=1;
  // spots
  ctx.fillStyle='#ff5fa3';
  for(let i=2;i<pts.length-1;i+=2){ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,S*.1,0,7);ctx.fill()}
  // head
  const h=pts[0], d=dir.x||dir.y?dir:{x:1,y:0}, px=-d.y, py=d.x;
  ctx.fillStyle='#ff8cc0';ctx.beginPath();ctx.arc(h.x,h.y,S*.44,0,7);ctx.fill();
  ctx.strokeStyle='#e0558f';ctx.lineWidth=3;ctx.stroke();
  for(const s of[-1,1]){
    const ex=h.x+d.x*S*.12+px*s*S*.2, ey=h.y+d.y*S*.12+py*s*S*.2;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,S*.15,0,7);ctx.fill();
    ctx.fillStyle='#3a2340';ctx.beginPath();ctx.arc(ex+d.x*S*.05,ey+d.y*S*.05,S*.08,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+d.x*S*.05-2,ey+d.y*S*.05-2,S*.03,0,7);ctx.fill();
    ctx.fillStyle='#ff5c8a66';ctx.beginPath();ctx.arc(h.x+d.x*S*.05+px*s*S*.33,h.y+d.y*S*.05+py*s*S*.33,S*.09,0,7);ctx.fill();
  }
  // tongue flick when food close
  const near=Math.abs(food.x-snake[0].x)+Math.abs(food.y-snake[0].y)<4;
  if(near&&Math.sin(time/90)>0){
    const tx=h.x+d.x*S*.45, ty=h.y+d.y*S*.45;
    ctx.strokeStyle='#ff3d6e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+d.x*S*.25,ty+d.y*S*.25);ctx.stroke();
  }
}
function drawParts(){
  parts=parts.filter(p=>p.l>0);
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l-=.03;
    ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.l,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function frame(now){
  const dt=Math.min(now-(last||now),100); last=now;
  if(running&&!paused){acc+=dt;while(acc>=stepMs&&alive){acc-=stepMs;step()}}
  const t=running?Math.min(acc/stepMs,1):1;
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.5)shake=0}
  drawBoard();
  if(snake){drawFood(now);drawSnake(alive?t:1,now);}
  drawParts();
  ctx.restore();
  requestAnimationFrame(frame);
}
reset();running=false;requestAnimationFrame(frame);

$('go').onclick=start;
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m){e.preventDefault();if(!running&&!alive||!running&&$('ov').classList.contains('hide')===false){start()}turn(...m)}
  else if(k===' '){e.preventDefault();if(!running)start();else{paused=!paused;sfx.pause()}}
  else if(k==='enter'&&!running)start();
});
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{
  e.preventDefault();if(!running)start();turn(...b.dataset.d.split(',').map(Number));
}));
let tx,ty;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{
  if(tx==null)return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24){tx=null;return}
  turn(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]));tx=null;
});
</script>
</body>
</html>
