<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Merci Studio Promo</title>
<style>
  html,body{margin:0;background:#111;}
  canvas{display:block;width:100vw;height:auto;}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="anim.js"></script>
<script>
  // Preview mode: open with ?play to watch in a browser.
  if (location.search.includes('play')) {
    boot().then(() => {
      const start = performance.now();
      const loop = () => { render(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
      loop();
    });
  }
</script>
</body>
</html>
